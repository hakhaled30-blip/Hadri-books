<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة حضري للكتب الإسلامية | منصة القراءة الرقمية</title>
    
    <!-- استيراد الخطوط العربية الفاخرة -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* إعدادات عامة */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f4f7f5;
            color: #111c18;
            line-height: 1.8;
        }

        /* القائمة العلوية */
        .navbar {
            background-color: #071b15;
            border-bottom: 2px solid #caa43c;
            padding: 15px 0;
        }
        .nav-container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #ffffff;
        }
        .logo-icon {
            font-size: 28px;
            background: #caa43c;
            padding: 5px 10px;
            border-radius: 8px;
        }
        .logo-text strong {
            display: block;
            font-family: 'Reem Kufi', sans-serif;
            font-size: 22px;
        }
        .logo-text span {
            font-size: 12px;
            color: #caa43c;
        }
        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            padding: 8px 15px;
            font-size: 15px;
            transition: color 0.3s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: #caa43c;
        }

        /* الواجهة الرئيسية الترحيبية */
        .header {
            background: linear-gradient(135deg, #04120e 0%, #071b15 100%);
            color: #ffffff;
            padding: 60px 0;
            text-align: center;
        }
        .hero {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .hero-label {
            background: rgba(202, 164, 60, 0.15);
            color: #caa43c;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            border: 1px solid #caa43c;
        }
        .hero h1 {
            font-family: 'Reem Kufi', sans-serif;
            font-size: 36px;
        }
        .hero h1 span {
            font-family: 'Amiri', serif;
            color: #caa43c;
        }
        .hero-description {
            max-width: 700px;
            color: #cccccc;
            font-size: 16px;
        }
        .hero-actions {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        .btn {
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .btn-primary {
            background-color: #caa43c;
            color: #071b15;
        }
        .btn-primary:hover {
            transform: translateY(-3px);
        }
        .btn-secondary {
            border: 1px solid #ffffff;
            color: #ffffff;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-3px);
        }

        /* صندوق البحث */
        .search-section {
            width: 90%;
            max-width: 800px;
            margin: -25px auto 40px;
        }
        .search-card {
            background: #ffffff;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
        }
        .search-card input {
            flex: 1;
            border: none;
            outline: none;
            padding: 10px;
            font-size: 16px;
            font-family: 'Tajawal', sans-serif;
        }
        .search-btn {
            background: #071b15;
            color: #ffffff;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .search-btn:hover {
            color: #caa43c;
        }

        /* محتوى الأقسام والشبكة */
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .section {
            margin-bottom: 60px;
        }
        .section-header {
            border-bottom: 2px solid #071b15;
            padding-bottom: 10px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .section-header h2 {
            font-family: 'Reem Kufi', sans-serif;
            color: #071b15;
        }
        .section-link {
            color: #caa43c;
            text-decoration: none;
            font-weight: bold;
        }

        /* كروت الكتب */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        .book-card {
            background: #ffffff;
            border: 1px solid #e1e1e1;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.3s;
        }
        .book-card:hover {
            transform: translateY(-5px);
            border-color: #caa43c;
        }
        .book-badge {
            align-self: flex-start;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .badge-quran { background: #e8f5e9; color: #1b5e20; }
        .badge-hadith { background: #e3f2fd; color: #0d47a1; }
        .badge-fiqh { background: #fff3e0; color: #e65100; }

        .book-title {
            font-family: 'Amiri', serif;
            font-size: 22px;
            color: #071b15;
            margin-bottom: 8px;
        }
        .book-author {
            font-size: 14px;
            color: #555555;
            margin-bottom: 15px;
        }
        .book-meta {
            background: #f9f9f9;
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            margin-top: auto;
        }
        .book-card-btn {
            background: #071b15;
            color: #ffffff;
            text-align: center;
            text-decoration: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .book-card:hover .book-card-btn {
            background: #caa43c;
            color: #071b15;
        }

        /* التذييل السفلي */
        .footer {
            background: #04120e;
            color: #ffffff;
            padding: 40px 0;
            border-top: 4px solid #caa43c;
            margin-top: 60px;
        }
        .footer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .footer-brand h3 {
            font-family: 'Reem Kufi', sans-serif;
            margin-bottom: 10px;
        }
        .footer-links h4 {
            color: #caa43c;
            margin-bottom: 15px;
        }
        .footer-links ul {
            list-style: none;
        }
        .footer-links ul li {
            margin-bottom: 8px;
        }
        .footer-links ul li a {
            color: #cccccc;
            text-decoration: none;
        }
        .footer-links ul li a:hover {
            color: #caa43c;
        }
        .footer-bottom {
            text-align: center;
            padding-top: 20px;
            margin-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 13px;
        }

        /* الاستجابة للهواتف */
        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                gap: 10px;
            }
            .search-card {
                flex-direction: column;
                gap: 10px;
            }
            .search-btn {
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- القائمة العلوية -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo">
                <div class="logo-icon">🕌</div>
                <div class="logo-text">
                    <strong>مكتبة حَضَري</strong>
                    <span>المنصة الإسلامية الرقمية</span>
                </div>
            </a>
            <div class="nav-links">
                <a href="#" class="active">الرئيسية</a>
                <a href="#quran">القرآن والتفسير</a>
                <a href="#hadith">الحديث الشريف</a>
                <a href="#aqida">العقيدة والفقه</a>
            </div>
        </div>
    </nav>

    <!-- الواجهة الرئيسية الترحيبية -->
    <header class="header">
        <div class="hero">
