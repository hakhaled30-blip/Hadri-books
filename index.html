<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة حضري للكتب الإسلامية | منصة القراءة الرقمية</title>
    <meta name="description" content="مكتبة حضري للكتب الإسلامية، منصة إلكترونية لقراءة القرآن الكريم والحديث الشريف وكتب العقيدة والفقه وغيرها من الكتب الإسلامية.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#071b15">

    <!-- استيراد خطوط عربية فاخرة واحترافية -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Reem+Kufi:wght@400..700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <style>
        /* =====================================================
           RESET & VARIABLES (Premium Palette)
        ===================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        :root {
            --primary: #071b15; /* أخضر حبري عميق جداً */
            --primary-light: #0d2e24; /* الأخضر التقليدي الفاخر */
            --primary-soft: #123f31; /* لون أفتح للأسطح التفاعلية */
            --accent: #caa43c; /* ذهبي ملكي مصقول */
            --accent-glow: rgba(202, 164, 60, 0.25);
            --accent-light: #f9f6ec; /* خلفية بيج ذهبية ناعمة جداً */
            --text-main: #111c18; /* أسود مائل للأخضر داكن جداً */
            --text-muted: #53635d; /* رمادي زيتي للنصوص الفرعية */
            --bg-body: #f4f7f5; /* خلفية ناصعة مريحة للعين */
            --white: #ffffff;
            --border-alpha: rgba(7, 27, 21, 0.06);
            --shadow-premium: 0 20px 40px -15px rgba(7, 27, 21, 0.05);
            --shadow-premium-hover: 0 30px 60px -20px rgba(7, 27, 21, 0.12);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
            --font-title: 'Reem Kufi', sans-serif;
            --font-body: 'Tajawal', sans-serif;
            --font-serif: 'Amiri', serif;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-body);
            color: var(--text-main);
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

        /* =====================================================
           HEADER & NAVBAR (Glassmorphism & Royal Accents)
        ===================================================== */
        .header {
            background: linear-gradient(145deg, #04120e 0%, #071b15 50%, #0c2b21 100%);
            color: var(--white);
            position: relative;
            overflow: hidden;
            padding-bottom: 60px;
        }

        /* دمج زخرفة هندسية ناعمة في الخلفية عبر الـ CSS */
        .header::before {
            content: "";
            position: absolute;
            inset: 0;
            opacity: 0.03;
            background-image: radial-gradient(var(--accent) 1px, transparent 0px), radial-gradient(var(--accent) 1px, transparent 0px);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            pointer-events: none;
        }

        .header::after {
            content: "";
            position: absolute;
            top: -20%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 75%);
            border-radius: 50%;
            pointer-events: none;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(7, 27, 21, 0.80);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(202, 164, 60, 0.15);
            transition: all 0.4s ease;
        }

        .nav-container {
            width: 92%;
            max-width: 1340px;
            margin: auto;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 16px;
            text-decoration: none;
            color: var(--white);
        }

        .logo-icon {
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, var(--accent), #a17f26);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 8px 20px rgba(202, 164, 60, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo-text strong {
            display: block;
            font-family: var(--font-title);
            font-size: 22px;
            font-weight: 700;
            color: var(--white);
            line-height: 1.2;
        }

        .logo-text span {
            display: block;
            font-size: 12px;
            color: var(--accent);
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.80);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-links a:hover, .nav-links a.active {
            background: rgba(202, 164, 60, 0.12);
            color: var(--accent);
        }

        /* =====================================================
           HERO SECTION (Luxury Layout)
        ===================================================== */
        .hero {
            width: 92%;
            max-width: 1340px;
            margin: auto;
            padding: 80px 0 100px;
            display: grid;
            grid-template-columns: 1.25fr 0.75fr;
            gap: 60px;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .hero-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background: rgba(202, 164, 60, 0.08);
            border: 1px solid rgba(202, 164, 60, 0.25);
            border-radius: 50px;
            color: var(--accent);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 28px;
            letter-spacing: 0.3px;
        }

        .hero h1 {
            font-family: var(--font-title);
            font-size: clamp(36px, 5vw, 56px);
            line-height: 1.25;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .hero h1 span {
            font-family: var(--font-serif);
            color: var(--accent);
            font-style: italic;
        }

        .hero-description {
            color: rgba(255, 255, 255, 0.75);
            font-size: 17px;
            line-height: 1.9;
            margin-bottom: 40px;
            max-width: 680px;
        }

        .hero-actions {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 32px;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, #b59030 100%);
            color: var(--primary);
            box-shadow: 0 10px 25px rgba(202, 164, 60, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-primary:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(202, 164, 60, 0.35);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--accent);
            transform: translateY(-4px);
        }

        /* 3D Floating Book Realism Illustration */
        .hero-book {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .floating-book {
            width: 280px;
            height: 370px;
            background: linear-gradient(135deg, var(--primary-light), #04120e);
            border-radius: 6px 18px 18px 6px;
            border: 1px solid rgba(202, 164, 60, 0.35);
            box-shadow: -15px 25px 50px rgba(0, 0, 0, 0.55), 
                        inset -3px 0 10px rgba(255, 255, 255, 0.05),
                        inset 5px 0 15px rgba(202, 164, 60, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 35px;
            color: var(--white);
            position: relative;
            transform: perspective(1200px) rotateY(-18deg) rotateX(6deg) rotateZ(1deg);
            animation: floatAnimation 5s ease-in-out infinite;
        }
