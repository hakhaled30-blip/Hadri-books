<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>القرآن الكريم</title>

<!-- خط مناسب للرسم العثماني -->
<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&display=swap"
      rel="stylesheet">


<style>

/* =========================================
   الإعدادات العامة
========================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #f8f6f0;
    color: #29251f;
    font-family: Arial, Tahoma, sans-serif;
}


/* =========================================
   رأس الصفحة
========================================= */

.header {
    background: linear-gradient(
        135deg,
        #173f35,
        #286052
    );

    color: white;
    text-align: center;

    padding: 28px 15px 25px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.12);
}

.header h1 {
    margin: 0;

    font-family: "Amiri", serif;

    font-size: 38px;
    font-weight: 700;
}

.header p {
    margin: 6px 0 0;

    font-size: 14px;

    opacity: .9;
}


/* =========================================
   منطقة البحث
========================================= */

.search-area {
    max-width: 850px;

    margin: 22px auto;

    padding: 0 15px;
}

.search-box {
    width: 100%;

    height: 52px;

    padding: 0 18px;

    border: 1px solid #ddd7ca;

    border-radius: 14px;

    background: #ffffff;

    color: #29251f;

    font-size: 16px;

    outline: none;

    direction: rtl;
}

.search-box:focus {
    border-color: #286052;

    box-shadow:
        0 0 0 3px
        rgba(40,96,82,.08);
}


/* =========================================
   قائمة السور
========================================= */

.surah-list {
    max-width: 900px;

    margin: 0 auto;

    padding: 0 15px 50px;
}

.surah-list h2 {
    margin: 15px 0;

    color: #173f35;

    font-family: "Amiri", serif;

    font-size: 24px;

    font-weight: 700;
}

.surahs {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 10px;
}

.surah-button {
    width: 100%;

    border: 1px solid #e2dcd0;

    background: #ffffff;

    border-radius: 13px;

    padding: 13px;

    display: flex;

    align-items: center;

    gap: 12px;

    cursor: pointer;

    text-align: right;

    transition: .2s;
}

.surah-button:hover {
    border-color: #286052;

    transform: translateY(-1px);

    box-shadow:
        0 5px 15px rgba(0,0,0,.06);
}

.surah-number {
    width: 36px;
    height: 36px;

    min-width: 36px;

    border-radius: 50%;

    background: #edf3f0;

    color: #286052;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 14px;

    font-weight: bold;
}

.surah-name {
    font-family: "Amiri", serif;

    font-size: 22px;

    color: #29251f;
}


/* =========================================
   قارئ القرآن
========================================= */

.reader {
    display: none;

    max-width: 920px;

    margin: 0 auto;

    padding: 15px 15px 60px;
}

.reader.active {
    display: block;
}


/* =========================================
   زر العودة
========================================= */

.back-button {
    display: block;

    margin: 0 auto 15px;

    padding: 10px 23px;

    border: 1px solid #ddd6ca;

    border-radius: 10px;

    background: white;

    color: #286052;

    font-size: 15px;

    cursor: pointer;
}


/* =========================================
   عنوان السورة
========================================= */

.surah-header {
    text-align: center;

    padding: 15px 10px 20px;
}

.surah-header h2 {
    margin: 0;

    color: #173f35;

    font-family: "Amiri", serif;

    font-size: 40px;

    font-weight: 700;
}

.surah-header p {
    margin: 7px 0 0;

    color: #777;

    font-size: 13px;
}


/* =========================================
   نص القرآن
========================================= */

.quran-text {

    width: 100%;

    background: transparent;

    border: none;

    box-shadow: none;

    padding: 5px 5px 35px;

    text-align: justify;

    text-align-last: right;

    /*
       مهم:
       يمنع المتصفح من تقسيم الكلمة
       أو التعامل معها كعنصر منفصل.
    */

    word-break: normal;

    overflow-wrap: normal;

    white-space: normal;
}


/* =========================================
   الآيات
========================================= */

.ayah {

    font-family:
        "Amiri Quran",
        "Amiri",
        serif;

    font-size: 31px;

    line-height: 2.45;

    font-weight: 400;

    color: #25221e;

    /*
       منع كسر الكلمات القرآنية
    */

    word-break: normal;

    overflow-wrap: normal;
}


/* =========================================
   أرقام الآيات
========================================= */

.ayah-number {

    display: inline;

    font-family:
        "Amiri Quran",
        "Amiri",
        serif;

    color: #286052;

    font-size: 27px;

    font-weight: 400;

    white-space: nowrap;

    margin: 0 4px;
}


/* =========================================
   أزرار التنقل
========================================= */

.navigation {
    display: flex;

    gap: 10px;

    margin-top: 20px;
}

.nav-button {
    flex: 1;

    padding: 13px;

    border: none;

    border-radius: 11px;

    background: #286052;

    color: white;

    font-size: 15px;

    cursor: pointer;
}

.nav-button:hover {
    background: #173f35;
}


/* =========================================
   رسالة الخطأ
========================================= */

.error {
    background: white;

    border: 1px solid #e2dcd1;

    border-radius: 14px;

    padding: 25px;

    text-align: center;

    color: #a33;
}


/* =========================================
   الهاتف
========================================= */

@media (max-width: 600px) {

    .header {
        padding: 23px 12px;
    }

    .header h1 {
        font-size: 32px;
    }

    .surahs {
        grid-template-columns: 1fr;
    }

    .reader {
        padding-left: 10px;
        padding-right: 10px;
    }

    .surah-header h2 {
        font-size: 34px;
    }

    .quran-text {
        padding-left: 0;
        padding-right: 0;

        text-align: right;
        text-align-last: right;
    }

    .ayah {
        font-size: 27px;

        line-height: 2.45;
    }

    .ayah-number {
        font-size: 24px;

        margin-left: 3px;
        margin-right: 3px;
    }

    .basmala {
        font-size: 27px;
    }

}


/* =========================================
   تحسين عرض أجهزة الهاتف الصغيرة جدًا
========================================= */

@media (max-width: 380px) {

    .ayah {
        font-size: 25px;

        line-height: 2.4;
    }

    .ayah-number {
        font-size: 22px;
    }

}

</style>

</head>


<body>


<!-- =========================================
     رأس الصفحة
========================================= -->

<header class="header">

    <h1>
        القرآن الكريم
    </h1>

    <p>
        قراءة القرآن الكريم بالرسم العثماني
    </p>

</header>


<!-- =========================================
     البحث
========================================= -->

<section
    id="searchArea"
    class="search-area">

    <input
        id="search"
        class="search-box"
        type="text"
        placeholder="ابحث عن سورة..."
        autocomplete="off">

</section>


<!-- =========================================
     قائمة السور
========================================= -->

<section
    id="surahList"
    class="surah-list">

    <h2>
        سور القرآن الكريم
    </h2>

    <div
        id="surahs"
        class="surahs">
    </div>

</section>


<!-- =========================================
     قارئ القرآن
========================================= -->

<section
    id="reader"
    class="reader">


    <button
        id="backButton"
        class="back-button">

        ← العودة إلى قائمة السور

    </button>


    <div class="surah-header">

        <h2 id="surahTitle"></h2>

        <p id="surahInfo"></p>

    </div>


    <div
        id="quranText"
        class="quran-text">
    </div>


    <div class="navigation">

        <button
            id="previousButton"
            class="nav-button">

            السورة السابقة

        </button>


        <button
            id="nextButton"
            class="nav-button">

            السورة التالية

        </button>

    </div>


</section>


<script>


/* =========================================

const surahNames = [

"الإخلاص",

];


/* =========================================
   عدد آيات السور
========================================= */

const ayahCounts = [

7,286,200,176,120,165,206,75,129,109,
123,111,43,52,99,128,111,110,98,135,
112,78,118,64,77,227,93,88,69,60,
34,30,73,54,45,83,182,88,75,85,
54,53,89,59,37,35,38,29,18,45,
60,49,62,55,78,96,29,22,24,13,
14,11,11,18,12,12,30,52,52,44,
28,28,20,56,40,31,50,40,46,42,
29,19,36,25,22,17,19,26,30,20,
15,21,11,8,8,19,5,8,8,11,
11,8,3,9,5,4,7,3,6,3,
5,4,5,6

];


/* =========================================
   المتغيرات
========================================= */

let quranData = [];

let currentSurah = 0;


/* =========================================
   تحويل الأرقام إلى أرقام عربية
========================================= */

function arabicNumber(number) {

    const digits = [
        "٠","١","٢","٣","٤",
        "٥","٦","٧","٨","٩"
    ];

    return String(number)
        .split("")
        .map(function(digit) {

            return digits[
                parseInt(digit, 10)
            ];

        })
        .join("");

}


/* =========================================
   تنظيف النص
========================================= */

function cleanVerseText(text) {

    /*
    إزالة أي رقم| يظهر في بداية النص
    */

    text = text.replace(
        /^\s*\d+\|/,
        ""
    );


    /*
    إزالة أسطر الحقوق
    */

    text = text.replace(
        /#.*$/gm,
        ""
    );


    /*
    تحويل الأسطر إلى مسافات
    */

    text = text.replace(
        /[\r\n]+/g,
        " "
    );


    /*
    إزالة المسافات المتكررة
    */

    text = text.replace(
        /\s+/g,
        " "
    );


    return text.trim();

}


/* =========================================
   قراءة quran-uthmani.txt
========================================= */

function parseQuran(text) {

    quranData = [];

    for (let i = 0; i < 114; i++) {

        quranData.push([]);

    }


    /*
    نزيل قسم حقوق Tanzil
    من نهاية الملف.
    */

    const copyrightIndex =
        text.indexOf("# PLEASE");

    if (copyrightIndex !== -1) {

        text =
            text.substring(
                0,
                copyrightIndex
            );

    }


    /*
    العلامة الموجودة في ملفك:

    1|
    2|
    3|

    نبحث عنها مباشرة.
    */

    const regex =
        /(\d+)\|/g;


    let markers = [];

    let match;


    while (
        (match = regex.exec(text)) !== null
    ) {

        markers.push({

            number:
                parseInt(
                    match[1],
                    10
                ),

            start:
                match.index,

            contentStart:
                regex.lastIndex

        });

    }


    /*
    استخراج الآيات
    */

    const verses = [];


    for (
        let i = 0;
        i < markers.length;
        i++
    ) {

        const start =
            markers[i].contentStart;


        const end =
            i + 1 < markers.length
                ? markers[i + 1].start
                : text.length;


        let verse =
            text.substring(
                start,
                end
            );


        verse =
            cleanVerseText(
                verse
            );


        if (verse.length === 0) {
            continue;
        }


        verses.push({
            number:
                markers[i].number,

            text:
                verse
        });

    }


    /*
    =========================================
    توزيع الآيات على السور
    =========================================

    نستخدم عدد الآيات المعروف لكل سورة.

    الرقم الموجود في ملف Tanzil هو رقم الآية،
    وليس رقم السورة.
    */

    let position = 0;


    for (
        let surah = 0;
        surah < 114;
        surah++
    ) {

        const count =
            ayahCounts[surah];


        for (
            let ayah = 0;
            ayah < count;
            ayah++
        ) {

            if (
                !verses[position]
            ) {

                break;

            }


            quranData[surah].push(
                verses[position].text
            );


            position++;

        }

    }

}


/* =========================================
   إنشاء قائمة السور
========================================= */

function createSurahList(
    searchText = ""
) {

    const container =
        document.getElementById(
            "surahs"
        );


    container.innerHTML = "";


    surahNames.forEach(
        function(name, index) {

            if (
                searchText &&
                !name.includes(
                    searchText
                )
            ) {

                return;

            }


            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "surah-button";


            button.innerHTML = `

                <span class="surah-number">
                    ${arabicNumber(index + 1)}
                </span>

                <span class="surah-name">
                    سورة ${name}
                </span>

            `;


            button.addEventListener(
                "click",
                function() {

                    openSurah(index);

                }
            );


            container.appendChild(
                button
            );

        }
    );

}


/* =========================================
   فتح السورة
========================================= */

function openSurah(index) {

    currentSurah = index;


    const ayahs =
        quranData[index];


    if (
        !ayahs ||
        ayahs.length === 0
    ) {

        alert(
            "لم يتم تحميل هذه السورة. تأكد من وجود quran-uthmani.txt."
        );

        return;

    }


    document.getElementById(
        "surahList"
    ).style.display = "none";


    document.getElementById(
        "searchArea"
    ).style.display = "none";


    document.getElementById(
        "reader"
    ).classList.add("active");


    document.getElementById(
        "surahTitle"
    ).textContent =
        "سورة " +
        surahNames[index];


    document.getElementById(
        "surahInfo"
    ).textContent =

        "السورة رقم " +
        arabicNumber(index + 1) +
        " • " +
        arabicNumber(
            ayahs.length
        ) +
        " آية";


    const quranText =
        document.getElementById(
            "quranText"
        );


    quranText.innerHTML = "";


    /*
    عرض الآيات.

    مهم:
    لا نضع الرقم الموجود في الملف.
    نعرض النص فقط ثم رقم الآية
    مرة واحدة.
    */

    ayahs.forEach(
        function(ayahText, index) {

            const verse =
                document.createElement(
                    "span"
                );


            verse.className =
                "ayah";


            verse.textContent =
                ayahText + " ";


            quranText.appendChild(
                verse
            );


            const number =
                document.createElement(
                    "span"
                );


            number.className =
                "ayah-number";


            number.textContent =
                "﴿" +
                arabicNumber(
                    index + 1
                ) +
                "﴾";


            quranText.appendChild(
                number
            );


            quranText.appendChild(
                document.createTextNode(
                    " "
                )
            );

        }
    );


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================
   العودة إلى السور
========================================= */

function showSurahList() {

    document.getElementById(
        "reader"
    ).classList.remove(
        "active"
    );


    document.getElementById(
        "surahList"
    ).style.display =
        "block";


    document.getElementById(
        "searchArea"
    ).style.display =
        "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================
   السورة السابقة
========================================= */

function previousSurah() {

    if (currentSurah > 0) {

        openSurah(
            currentSurah - 1
        );

    }

}


/* =========================================
   السورة التالية
========================================= */

function nextSurah() {

    if (currentSurah < 113) {

        openSurah(
            currentSurah + 1
        );

    }

}


/* =========================================
   البحث
========================================= */

function searchSurah() {

    const value =
        document.getElementById(
            "search"
        ).value.trim();


    createSurahList(
        value
    );

}


/* =========================================
   الأزرار
========================================= */

document.getElementById(
    "backButton"
).addEventListener(
    "click",
    showSurahList
);


document.getElementById(
    "previousButton"
).addEventListener(
    "click",
    previousSurah
);


document.getElementById(
    "nextButton"
).addEventListener(
    "click",
    nextSurah
);


document.getElementById(
    "search"
).addEventListener(
    "input",
    searchSurah
);


/* =========================================
   تحميل القرآن
========================================= */

fetch(
    "quran-uthmani.txt"
)

.then(
    function(response) {

        if (!response.ok) {

            throw new Error(
                "لم يتم العثور على الملف"
            );

        }

        return response.text();

    }
)

.then(
    function(text) {

        parseQuran(text);

        createSurahList();

    }
)

.catch(
    function(error) {

        document.getElementById(
            "surahs"
        ).innerHTML = `

            <div class="error">

                <strong>
                    تعذر تحميل القرآن
                </strong>

                <br><br>

                يجب أن يكون الملف:

                <br><br>

                <b>
                    quran-uthmani.txt
                </b>

                <br><br>

                في نفس مجلد
                index.html.

            </div>

        `;

    }
);

</script>
