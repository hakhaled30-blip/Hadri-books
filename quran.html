<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>القرآن الكريم</title>

<style>

/* ==============================
   التصميم العام
============================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f7f5ef;
    color: #29251f;
    font-family: Tahoma, Arial, sans-serif;
}


/* ==============================
   رأس الموقع
============================== */

.header {
    background: linear-gradient(135deg, #173f35, #285f50);
    color: white;
    text-align: center;
    padding: 25px 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,.12);
}

.header h1 {
    margin: 0;
    font-family: "Traditional Arabic", "Amiri", serif;
    font-size: 36px;
}

.header p {
    margin: 7px 0 0;
    font-size: 14px;
    opacity: .9;
}


/* ==============================
   البحث
============================== */

.search-area {
    max-width: 850px;
    margin: 20px auto;
    padding: 0 15px;
}

.search-box {
    width: 100%;
    border: 1px solid #ddd7cb;
    background: white;
    border-radius: 14px;
    padding: 15px 18px;
    font-size: 16px;
    outline: none;
    direction: rtl;
}

.search-box:focus {
    border-color: #285f50;
}


/* ==============================
   قائمة السور
============================== */

.surah-list {
    max-width: 850px;
    margin: 0 auto 30px;
    padding: 0 15px;
}

.surah-list h2 {
    color: #173f35;
    font-size: 21px;
    margin: 15px 0;
}

.surahs {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.surah-button {
    border: 1px solid #e2ddd2;
    background: white;
    border-radius: 13px;
    padding: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: .2s;
    text-align: right;
}

.surah-button:hover {
    border-color: #285f50;
    transform: translateY(-2px);
    box-shadow: 0 5px 14px rgba(0,0,0,.07);
}

.surah-number {
    width: 35px;
    height: 35px;
    min-width: 35px;
    border-radius: 50%;
    background: #edf4f1;
    color: #285f50;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.surah-name {
    font-family: "Traditional Arabic", "Amiri", serif;
    font-size: 21px;
}


/* ==============================
   قارئ القرآن
============================== */

.reader {
    display: none;
    max-width: 900px;
    margin: 25px auto;
    padding: 0 15px 50px;
}

.reader.active {
    display: block;
}


/* ==============================
   زر العودة
============================== */

.back-button {
    display: block;
    margin: 0 auto 20px;
    background: white;
    color: #285f50;
    border: 1px solid #d8d1c5;
    border-radius: 10px;
    padding: 10px 25px;
    font-size: 15px;
    cursor: pointer;
}


/* ==============================
   عنوان السورة
============================== */

.surah-header {
    background: white;
    border: 1px solid #e3ddd1;
    border-radius: 18px;
    padding: 25px 15px;
    text-align: center;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,.04);
}

.surah-header h2 {
    margin: 0;
    color: #173f35;
    font-family: "Traditional Arabic", "Amiri", serif;
    font-size: 35px;
}

.surah-header p {
    margin: 7px 0 0;
    color: #777;
    font-size: 13px;
}


/* ==============================
   البسملة
============================== */

.basmala {
    text-align: center;
    color: #285f50;
    font-family: "Traditional Arabic", "Amiri", serif;
    font-size: 29px;
    line-height: 2;
    margin: 20px 5px 25px;
}


/* ==============================
   نص القرآن
============================== */

.quran-text {
    background: white;
    border: 1px solid #e3ddd1;
    border-radius: 18px;
    padding: 30px 25px;
    box-shadow: 0 4px 18px rgba(0,0,0,.04);

    text-align: right;
}


/* الآية */

.ayah {
    font-family: "Traditional Arabic", "Amiri", serif;
    font-size: 30px;
    line-height: 2.25;
}


/* رقم الآية */

.ayah-number {
    display: inline-flex;

    width: 32px;
    height: 32px;

    border: 1px solid #285f50;
    border-radius: 50%;

    color: #285f50;

    align-items: center;
    justify-content: center;

    font-family: Arial, sans-serif;
    font-size: 12px;

    margin: 0 7px;

    vertical-align: middle;
}


/* ==============================
   أزرار التنقل
============================== */

.navigation {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.nav-button {
    flex: 1;
    border: none;
    background: #285f50;
    color: white;
    padding: 13px;
    border-radius: 12px;
    font-size: 15px;
    cursor: pointer;
}

.nav-button:hover {
    background: #173f35;
}


/* ==============================
   رسالة الخطأ
============================== */

.error {
    background: white;
    border-radius: 15px;
    padding: 25px;
    text-align: center;
    color: #a33;
}


/* ==============================
   الهاتف
============================== */

@media (max-width: 600px) {

    .header h1 {
        font-size: 30px;
    }

    .surahs {
        grid-template-columns: 1fr;
    }

    .quran-text {
        padding: 22px 15px;
        border-radius: 14px;
    }

    .ayah {
        font-size: 26px;
        line-height: 2.25;
    }

    .basmala {
        font-size: 25px;
    }

    .surah-header h2 {
        font-size: 30px;
    }

    .ayah-number {
        width: 29px;
        height: 29px;
    }

}

</style>

</head>


<body>


<!-- ==============================
     رأس الصفحة
============================== -->

<header class="header">

    <h1>القرآن الكريم</h1>

    <p>
        قراءة القرآن الكريم بالرسم العثماني
    </p>

</header>



<!-- ==============================
     البحث
============================== -->

<section class="search-area">

    <input
        id="search"
        class="search-box"
        type="text"
        placeholder="ابحث عن سورة..."
        oninput="searchSurah()"
    >

</section>



<!-- ==============================
     قائمة السور
============================== -->

<section id="surahList" class="surah-list">

    <h2>
        سور القرآن الكريم
    </h2>

    <div id="surahs" class="surahs"></div>

</section>



<!-- ==============================
     قارئ القرآن
============================== -->

<section id="reader" class="reader">


    <button
        class="back-button"
        onclick="showSurahList()"
    >
        ← العودة إلى قائمة السور
    </button>



    <div class="surah-header">

        <h2 id="surahTitle"></h2>

        <p id="surahInfo"></p>

    </div>



    <div
        id="basmala"
        class="basmala"
    >
        بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
    </div>



    <div
        id="quranText"
        class="quran-text"
    ></div>



    <div class="navigation">

        <button
            class="nav-button"
            onclick="previousSurah()"
        >
            السورة السابقة
        </button>

        <button
            class="nav-button"
            onclick="nextSurah()"
        >
            السورة التالية
        </button>

    </div>


</section>

"الفلق",

];


/* =========================================
   عدد آيات كل سورة
========================================= */

const ayahCounts = [

7,286,200,176,120,165,206,75,129,109,
123,111,43,52,99,128,111,110,98,135,
112,78,118,64,77,227,93,88,69,60,
34,30,73,54,45,83,182,88,75,85,
54,53,89,59,37,35,38,29,18,45,
60,49,62,55,78,96,29,22,24,13,
14,11,11,18,12,12,30,52,52,44,
28,28,20,56,40,31,50,40,46,42,
29,19,36,25,22,17,19,26,30,20,
15,21,11,8,8,19,5,8,8,11,
11,8,3,9,5,4,7,3,6,3,
5,4,5,6

];


/* =========================================
   متغيرات
========================================= */

let quranData = [];

let currentSurah = 0;


/* =========================================
   تحميل ملف القرآن
========================================= */

async function loadQuran() {

    try {

        const response =
            await fetch("quran-uthmani.txt");

        if (!response.ok) {

            throw new Error(
                "لم يتم العثور على الملف"
            );

        }

        const text =
            await response.text();

        parseQuran(text);

        createSurahList();

    }

    catch (error) {

        document.getElementById("surahs").innerHTML = `

            <div class="error">

                <strong>
                    تعذر تحميل القرآن
                </strong>

                <br><br>

                تأكد من وجود الملف:

                <br>

                <b>
                    quran-uthmani.txt
                </b>

                <br><br>

                في نفس مجلد صفحة الموقع.

            </div>

        `;

    }

}


/* =========================================
   قراءة ملف quran-uthmani.txt
========================================= */

function parseQuran(text) {

    /*
       مهم جدًا:

       ملفك يحتوي على:

       1|الآية الأولى
       2|الآية الثانية
       3|الآية الثالثة

       ثم تبدأ السورة التالية من جديد:

       1|...
       
       لذلك الرقم قبل | هو رقم الآية،
       وليس رقم السورة.
    */


    const lines =
        text
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(line => line.length > 0);


    quranData = [];

    let surahIndex = 0;

    let ayahIndex = 0;


    quranData.push([]);


    for (let line of lines) {


        /*
        تجاهل أسطر التعليقات وحقوق Tanzil
        */

        if (
            line.startsWith("#") ||
            line.startsWith("COPYRIGHT") ||
            line.includes("Tanzil Quran Text")
        ) {

            continue;

        }


        /*
        قراءة الرقم الموجود قبل |
        */

        const separator =
            line.indexOf("|");


        if (separator === -1) {

            continue;

        }


        const numberText =
            line.substring(0, separator);


        const ayahNumber =
            parseInt(numberText);


        if (
            isNaN(ayahNumber) ||
            ayahNumber < 1
        ) {

            continue;

        }


        /*
        استخراج نص الآية فقط
        */

        const ayahText =
            line.substring(separator + 1).trim();


        if (!ayahText) {

            continue;

        }


        /*
        إذا وصلنا إلى عدد آيات السورة
        ننتقل للسورة التالية
        */

        if (
            ayahIndex >=
            ayahCounts[surahIndex]
        ) {

            surahIndex++;

            ayahIndex = 0;

            quranData.push([]);

        }


        if (surahIndex >= 114) {

            break;

        }


        quranData[surahIndex].push(
            ayahText
        );


        ayahIndex++;

    }

}


/* =========================================
   إنشاء قائمة السور
========================================= */

function createSurahList(filter = "") {

    const container =
        document.getElementById("surahs");

    container.innerHTML = "";


    surahNames.forEach(
        (name, index) => {

            if (
                filter &&
                !name.includes(filter)
            ) {

                return;

            }


            const button =
                document.createElement("button");


            button.className =
                "surah-button";


            button.innerHTML = `

                <span class="surah-number">

                    ${index + 1}

                </span>

                <span class="surah-name">

                    سورة ${name}

                </span>

            `;


            button.onclick =
                () => openSurah(index);


            container.appendChild(button);

        }
    );

}


/* =========================================
   فتح السورة
========================================= */

function openSurah(index) {

    currentSurah = index;


    const ayahs =
        quranData[index];


    if (
        !ayahs ||
        ayahs.length === 0
    ) {

        alert(
            "لم يتم تحميل آيات هذه السورة."
        );

        return;

    }


    document.getElementById(
        "surahList"
    ).style.display = "none";


    document.getElementById(
        "search"
    ).style.display = "none";


    document.getElementById(
        "reader"
    ).classList.add("active");


    document.getElementById(
        "surahTitle"
    ).textContent =
        "سورة " + surahNames[index];


    document.getElementById(
        "surahInfo"
    ).textContent =

        "السورة رقم " +
        (index + 1) +
        " • " +
        ayahs.length +
        " آية";


    /*
    التوبة بدون بسملة
    */

    if (index === 8) {

        document.getElementById(
            "basmala"
        ).style.display = "none";

    }

    else {

        document.getElementById(
            "basmala"
        ).style.display = "block";

    }


    const quranText =
        document.getElementById(
            "quranText"
        );


    quranText.innerHTML = "";


    /*
    إنشاء الآيات
    */

    ayahs.forEach(
        (ayah, i) => {


            const span =
                document.createElement(
                    "span"
                );


            span.className =
                "ayah";


            span.textContent =
                ayah + " ";


            quranText.appendChild(
                span
            );


            const number =
                document.createElement(
                    "span"
                );


            number.className =
                "ayah-number";


            number.textContent =
                i + 1;


            quranText.appendChild(
                number
            );


        }
    );


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* =========================================
   العودة للقائمة
========================================= */

function showSurahList() {

    document.getElementById(
        "reader"
    ).classList.remove("active");


    document.getElementById(
        "surahList"
    ).style.display = "block";


    document.getElementById(
        "search"
    ).style.display = "block";


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* =========================================
   السورة السابقة
========================================= */

function previousSurah() {

    if (currentSurah > 0) {

        openSurah(
            currentSurah - 1
        );

    }

}


/* =========================================
   السورة التالية
========================================= */

function nextSurah() {

    if (currentSurah < 113) {

        openSurah(
            currentSurah + 1
        );

    }

}


/* =========================================
   البحث
========================================= */

function searchSurah() {

    const value =
        document.getElementById(
            "search"
        ).value.trim();


    createSurahList(value);

}


/* =========================================
   تشغيل
========================================= */

loadQuran();

</script>

</html>
