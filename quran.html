<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>القرآن الكريم - حضري للكتب الإسلامية</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f5f7f6;
    color:#222;
    font-family:Tahoma,Arial,sans-serif;
}

header{
    background:#0f5132;
    color:white;
    text-align:center;
    padding:25px 15px;
}

header h1{
    margin:0 0 8px;
    font-size:28px;
}

header p{
    margin:0;
    opacity:.9;
}

.top{
    width:94%;
    max-width:1000px;
    margin:18px auto;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.home,
.saved{
    display:inline-block;
    padding:11px 18px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
}

.home{
    background:#0f5132;
    color:white;
}

.saved{
    background:#e7eee9;
    color:#0f5132;
    border:1px solid #cbdacf;
    cursor:pointer;
}

.search{
    width:94%;
    max-width:1000px;
    margin:0 auto 20px;
}

.search input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

.search input:focus{
    border-color:#0f5132;
}

.container{
    width:94%;
    max-width:1000px;
    margin:auto;
}

.surah-list{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;
    margin-bottom:25px;
}

.surah-btn{
    background:white;
    border:1px solid #ddd;
    border-radius:10px;
    padding:12px;
    cursor:pointer;
    font-size:16px;
    color:#0f5132;
}

.surah-btn:hover{
    background:#edf5f0;
}

.surah{
    display:none;
    background:white;
    border-radius:15px;
    padding:25px 20px;
    box-shadow:0 3px 15px rgba(0,0,0,.07);
    margin-bottom:30px;
}

.surah.active{
    display:block;
}

.surah-title{
    text-align:center;
    color:#0f5132;
    margin-bottom:20px;
}

.surah-title h2{
    margin:0 0 8px;
    font-size:25px;
}

.surah-title p{
    margin:0;
    color:#777;
}

.basmala{
    text-align:center;
    font-family:"Traditional Arabic","Amiri",serif;
    font-size:30px;
    line-height:2.2;
    margin-bottom:18px;
}

.quran-text{
    font-family:"Traditional Arabic","Amiri","Scheherazade New",serif;
    font-size:30px;
    line-height:2.35;
    text-align:justify;
}

.ayah{
    cursor:pointer;
    border-radius:8px;
    padding:2px 4px;
    transition:.2s;
}

.ayah:hover{
    background:#f0f5f2;
}

.ayah.saved-position{
    background:#e5f0e8;
    box-shadow:0 0 0 2px #0f5132 inset;
}

.navigation{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:25px;
}

.nav-btn{
    border:0;
    background:#0f5132;
    color:white;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.nav-btn:disabled{
    background:#ccc;
    cursor:not-allowed;
}

.message{
    text-align:center;
    color:#777;
    padding:30px;
}

footer{
    background:#0f5132;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}

@media(max-width:600px){

    header h1{
        font-size:24px;
    }

    .quran-text{
        font-size:26px;
        line-height:2.25;
    }

    .basmala{
        font-size:27px;
    }

    .surah{
        padding:20px 14px;
    }

    .surah-list{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<header>
    <h1>📖 القرآن الكريم</h1>
    <p>المصحف الشريف بالرسم العثماني</p>
</header>

<div class="top">

    <a class="home" href="index.html">
        ← الرئيسية
    </a>

    <button class="saved" id="savedButton">
        📍 موضع القراءة المحفوظ
    </button>

</div>

<div class="search">
    <input
        type="search"
        id="search"
        placeholder="ابحث عن اسم السورة..."
        autocomplete="off">
</div>

<main class="container">

    <div id="surahList" class="surah-list"></div>

    <div id="quran">
        <div class="message">
            جاري تحميل القرآن الكريم...
        </div>
    </div>

</main>

<footer>
    © 2026 حضري للكتب الإسلامية
    <br>
    مكتبة إلكترونية إسلامية
</footer>

<script>

const quranFile = "quran-uthmani.txt";

const surahNames = [
"الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام",
"الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد",
"إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه",
"الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء",
"النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب",
"سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت",
"الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح",
"الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن",
"الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف",
"الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك",
"القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر",
"القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس",
"التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق",
"الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى",
"الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات",
"القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون",
"الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"
];

let surahs = [];
let currentSurah = 0;

function parseQuran(text){

    const lines = text
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean);

    const result = [];

    for(let i = 0; i < 114; i++){
        result.push([]);
    }

    /*
      يدعم الملف بالشكل:
      سورة|آية|النص

      وكذلك:
      سورة:آية:النص
    */

    lines.forEach(line => {

        let parts;

        if(line.includes("|")){
            parts = line.split("|");
        }else if(line.includes(":")){
            parts = line.split(":");
        }else{
            return;
        }

        if(parts.length < 3) return;

        const surahNumber = parseInt(parts[0]);
        const ayahNumber = parseInt(parts[1]);

        if(
            Number.isNaN(surahNumber) ||
            Number.isNaN(ayahNumber) ||
            surahNumber < 1 ||
            surahNumber > 114
        ){
            return;
        }

        const text = parts.slice(2).join("|").trim();

        if(text){
            result[surahNumber - 1].push({
                number:ayahNumber,
                text:text
            });
        }
    });

    return result;
}

function createSurahButtons(){

    const list = document.getElementById("surahList");

    list.innerHTML = "";

    surahNames.forEach((name,index)=>{

        const button = document.createElement("button");

        button.className = "surah-btn";
        button.textContent = name;

        button.dataset.name = name;
        button.dataset.number = index + 1;

        button.onclick = ()=>{
            showSurah(index);
        };

        list.appendChild(button);

    });
}

function renderQuran(){

    const container = document.getElementById("quran");

    container.innerHTML = "";

    surahs.forEach((ayahs,index)=>{

        const section = document.createElement("section");

        section.className = "surah";
        section.id = "surah-" + (index + 1);

        const title = document.createElement("div");

        title.className = "surah-title";

        title.innerHTML =
            "<h2>سورة " +
            surahNames[index] +
            "</h2>" +
            "<p>السورة " +
            (index + 1) +
            " من 114</p>";

        section.appendChild(title);

        if(index !== 8){

            const basmala = document.createElement("div");

            basmala.className = "basmala";

            basmala.textContent =
                "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ";

            section.appendChild(basmala);
        }

        const text = document.createElement("div");

        text.className = "quran-text";

        ayahs.forEach(ayah=>{

            const span = document.createElement("span");

            span.className = "ayah";

            span.dataset.surah = index + 1;
            span.dataset.ayah = ayah.number;

            span.textContent =
                ayah.text + " (" + ayah.number + ") ";

            span.addEventListener("click",()=>{

                savePosition(index + 1,ayah.number);

                clearSavedVisual();

                span.classList.add("saved-position");

            });

            text.appendChild(span);

        });

        section.appendChild(text);

        const navigation = document.createElement("div");

        navigation.className = "navigation";

        const previous = document.createElement("button");

        previous.className = "nav-btn";

        previous.textContent = "→ السابقة";

        previous.disabled = index === 0;

        previous.onclick = ()=>{
            showSurah(index - 1);
        };

        const next = document.createElement("button");

        next.className = "nav-btn";

        next.textContent = "التالية ←";

        next.disabled = index === 113;

        next.onclick = ()=>{
            showSurah(index + 1);
        };

        navigation.appendChild(previous);
        navigation.appendChild(next);

        section.appendChild(navigation);

        container.appendChild(section);

    });
}

function showSurah(index){

    if(index < 0 || index > 113) return;

    currentSurah = index;

    document.querySelectorAll(".surah").forEach(s=>{
        s.classList.remove("active");
    });

    const selected =
        document.getElementById("surah-" + (index + 1));

    if(selected){

        selected.classList.add("active");

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
}

function savePosition(surah,ayah){

    localStorage.setItem(
        "quranReadingPosition",
        JSON.stringify({
            surah:surah,
            ayah:ayah
        })
    );

    markSavedPosition();
}

function getSavedPosition(){

    try{

        const saved =
            localStorage.getItem("quranReadingPosition");

        if(!saved) return null;

        return JSON.parse(saved);

    }catch(e){

        return null;

    }
}

function clearSavedVisual(){

    document.querySelectorAll(".ayah").forEach(a=>{
        a.classList.remove("saved-position");
    });

}

function markSavedPosition(){

    const saved = getSavedPosition();

    if(!saved) return;

    const element = document.querySelector(
        '.ayah[data-surah="' +
        saved.surah +
        '"][data-ayah="' +
        saved.ayah +
        '"]'
    );

    if(element){

        clearSavedVisual();

        element.classList.add("saved-position");

    }
}

document.getElementById("savedButton").onclick = ()=>{

    const saved = getSavedPosition();

    if(!saved){

        alert("لا يوجد موضع قراءة محفوظ بعد.");

        return;
    }

    showSurah(saved.surah - 1);

    setTimeout(()=>{

        const element = document.querySelector(
            '.ayah[data-surah="' +
            saved.surah +
            '"][data-ayah="' +
            saved.ayah +
            '"]'
        );

        if(element){

            clearSavedVisual();

            element.classList.add("saved-position");

            element.scrollIntoView({
                behavior:"smooth",
                block:"center"
            });

        }

    },100);

};

document.getElementById("search").addEventListener("input",function(){

    const value = this.value.trim();

    document.querySelectorAll(".surah-btn").forEach(button=>{

        const name = button.dataset.name;

        button.style.display =
            !value || name.includes(value)
            ? ""
            : "none";

    });

});

async function loadQuran(){

    try{

        const response = await fetch(quranFile);

        if(!response.ok){
            throw new Error("تعذر تحميل ملف القرآن");
        }

        const text = await response.text();

        surahs = parseQuran(text);

        const total = surahs.reduce(
            (sum,ayahs)=>sum + ayahs.length,
            0
        );

        if(total === 0){
            throw new Error(
                "لم يتم التعرف على صيغة ملف القرآن"
            );
        }

        createSurahButtons();

        renderQuran();

        const saved = getSavedPosition();

        if(saved &&
           saved.surah >= 1 &&
           saved.surah <= 114){

            showSurah(saved.surah - 1);

            setTimeout(()=>{

                const element = document.querySelector(
                    '.ayah[data-surah="' +
                    saved.surah +
                    '"][data-ayah="' +
                    saved.ayah +
                    '"]'
                );

                if(element){

                    element.classList.add(
                        "saved-position"
                    );

                }

            },100);

        }else{

            showSurah(0);

        }

    }catch(error){

        document.getElementById("quran").innerHTML =

            '<div class="message">' +
            'تعذر تحميل القرآن الكريم.<br><br>' +
            'تأكد من وجود الملف <b>quran-uthmani.txt</b> ' +
            'في نفس مجلد هذه الصفحة.' +
            '</div>';

        console.error(error);

    }

}

loadQuran();

</script>

</body>
</html>
