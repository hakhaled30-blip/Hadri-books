<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القرآن الكريم</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f7f5ef;
    color: #29251f;
    font-family: "Tahoma", "Arial", sans-serif;
}

/* رأس الصفحة */
.header {
    background: linear-gradient(135deg, #173f35, #24594b);
    color: white;
    padding: 25px 15px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,.15);
}

.header h1 {
    margin: 0;
    font-family: "Traditional Arabic", "Amiri", serif;
    font-size: 34px;
}

.header p {
    margin: 8px 0 0;
    opacity: .9;
    font-size: 14px;
}

/* البحث */
.search-area {
    max-width: 850px;
    margin: 20px auto;
    padding: 0 15px;
}

.search-box {
    width: 100%;
    border: 1px solid #ddd6c9;
    background: white;
    border-radius: 14px;
    padding: 15px 18px;
    font-size: 16px;
    outline: none;
    direction: rtl;
}

.search-box:focus {
    border-color: #2d7561;
    box-shadow: 0 0 0 3px rgba(45,117,97,.1);
}

/* قائمة السور */
.surah-list {
    max-width: 850px;
    margin: 0 auto 25px;
    padding: 0 15px;
}

.surah-list h2 {
    font-size: 20px;
    margin: 15px 0;
    color: #173f35;
}

.surahs {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.surah-button {
    border: 1px solid #e2dccf;
    background: white;
    border-radius: 12px;
    padding: 14px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: .2s;
    text-align: right;
}

.surah-button:hover {
    transform: translateY(-2px);
    border-color: #2d7561;
    box-shadow: 0 5px 15px rgba(0,0,0,.07);
}

.surah-number {
    width: 34px;
    height: 34px;
    min-width: 34px;
    border-radius: 50%;
    background: #edf4f1;
    color: #24594b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.surah-name {
    font-family: "Traditional Arabic", "Amiri", serif;
    font-size: 21px;
}

/* منطقة القراءة */
.reader {
    display: none;
    max-width: 900px;
    margin: 25px auto;
    padding: 0 15px 50px;
}

.reader.active {
    display: block;
}

/* رأس السورة */
.surah-header {
    background: white;
    border-radius: 18px;
    padding: 25px 15px;
    text-align: center;
    margin-bottom: 20px;
    border: 1px solid #e4ded2;
    box-shadow: 0 4px 15px rgba(0,0,0,.05);
}

.surah-header h2 {
    margin: 0;
    color: #173f35;
    font-family: "Traditional Arabic", "Amiri", serif;
    font-size: 34px;
}

.surah-header p {
    margin: 7px 0 0;
    color: #777;
    font-size: 13px;
}

/* البسملة */
.basmala {
    text-align: center;
    font-family: "Traditional Arabic", "Amiri", serif;
    font-size: 29px;
    line-height: 2;
    color: #24594b;
    margin: 20px 5px 30px;
}

/* الآيات */
.quran-text {
    background: white;
    border-radius: 18px;
    padding: 30px 25px;
    border: 1px solid #e4ded2;
    box-shadow: 0 4px 18px rgba(0,0,0,.04);
}

.ayah {
    display: inline;
    font-family: "Traditional Arabic", "Amiri", serif;
    font-size: 29px;
    line-height: 2.25;
}

.ayah-number {
    display: inline-flex;
    width: 32px;
    height: 32px;
    border: 1px solid #2d7561;
    color: #24594b;
    border-radius: 50%;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    font-size: 13px;
    margin: 0 7px;
    vertical-align: middle;
}

/* أزرار التنقل */
.navigation {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 20px;
}

.nav-button {
    flex: 1;
    border: none;
    background: #24594b;
    color: white;
    padding: 13px;
    border-radius: 12px;
    font-size: 15px;
    cursor: pointer;
}

.nav-button:hover {
    background: #173f35;
}

.back-button {
    display: block;
    margin: 0 auto 20px;
    border: 1px solid #d8d1c5;
    background: white;
    color: #24594b;
    padding: 10px 25px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
}

/* رسالة الخطأ */
.error {
    text-align: center;
    background: #fff;
    border-radius: 15px;
    padding: 25px;
    color: #a33;
}

/* الهاتف */
@media (max-width: 600px) {

    .header {
        padding: 20px 10px;
    }

    .header h1 {
        font-size: 29px;
    }

    .surahs {
        grid-template-columns: 1fr;
    }

    .surah-button {
        padding: 12px;
    }

    .surah-name {
        font-size: 20px;
    }

    .quran-text {
        padding: 22px 15px;
        border-radius: 14px;
    }

    .ayah {
        font-size: 25px;
        line-height: 2.2;
    }

    .basmala {
        font-size: 25px;
    }

    .surah-header h2 {
        font-size: 30px;
    }

    .ayah-number {
        width: 29px;
        height: 29px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<header class="header">
    <h1>القرآن الكريم</h1>
    <p>تلاوة وقراءة القرآن الكريم</p>
</header>

<section class="search-area">
    <input
        id="search"
        class="search-box"
        type="text"
        placeholder="ابحث عن سورة..."
        oninput="searchSurah()"
    >
</section>

<section id="surahList" class="surah-list">
    <h2>سور القرآن الكريم</h2>
    <div id="surahs" class="surahs"></div>
</section>

<section id="reader" class="reader">

    <button class="back-button" onclick="showSurahList()">
        ← العودة إلى قائمة السور
    </button>

    <div class="surah-header">
        <h2 id="surahTitle"></h2>
        <p id="surahInfo"></p>
    </div>

    <div id="basmala" class="basmala">
        بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
    </div>

    <div id="quranText" class="quran-text"></div>

    <div class="navigation">
        <button class="nav-button" onclick="previousSurah()">
            السورة السابقة
        </button>

        <button class="nav-button" onclick="nextSurah()">
            السورة التالية
        </button>
    </div>

</section>

<script>

/*

أسماء سور القرآن الكريم
==================================================
*/

const surahNames = [

"الإخلاص",
"الفلق",
"الناس"
];


/*
==================================================
عدد آيات كل سورة
==================================================
*/

const ayahCounts = [
7,286,200,176,120,165,206,75,129,109,
123,111,43,52,99,128,111,110,98,135,
112,78,118,64,77,227,93,88,69,60,
34,30,73,54,45,83,182,88,75,85,
54,53,89,59,37,35,38,29,18,45,
60,49,62,55,78,96,29,22,24,13,
14,11,11,18,12,12,30,52,52,44,
28,28,20,56,40,31,50,40,46,42,
29,19,36,25,22,17,19,26,30,20,
15,21,11,8,8,19,5,8,8,11,
11,8,3,9,5,4,7,3,6,3,
5,4,5,6
];


/*
==================================================
بيانات القرآن
==================================================
*/

let quranData = [];

let currentSurah = 0;


/*
==================================================
قراءة ملف القرآن
==================================================
*/

async function loadQuran() {

    try {

        /*
        مهم:
        يجب أن يكون quran-uthmani.txt
        في نفس مجلد صفحة HTML
        */

        const response = await fetch("quran-uthmani.txt");

        if (!response.ok) {
            throw new Error("لم يتم العثور على ملف القرآن");
        }

        const text = await response.text();

        parseQuran(text);

        createSurahList();

    } catch (error) {

        document.getElementById("surahs").innerHTML = `
            <div class="error">
                <strong>تعذر تحميل القرآن</strong>
                <br><br>
                تأكد من وجود الملف:
                <br>
                <b>quran-uthmani.txt</b>
                <br><br>
                في نفس مجلد صفحة HTML.
            </div>
        `;

    }

}


/*
==================================================
تحليل ملف القرآن
==================================================
*/

function parseQuran(text) {

    /*
    ملف Tanzil غالبًا يكون بالشكل:

    1|بِسْمِ اللَّهِ...
    1|الْحَمْدُ لِلَّهِ...
    1|...
    2|الم...
    
    لذلك نحاول قراءة رقم السورة من بداية كل سطر.
    */

    const lines = text
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(line => line.length > 0);

    quranData = [];

    let surahIndex = 0;
    let ayahIndex = 0;

    quranData.push([]);

    for (let line of lines) {

        let parts = line.split("|");

        if (parts.length >= 2) {

            let surahNumber = parseInt(parts[0]);

            let ayahText = parts.slice(1).join("|").trim();

            if (!isNaN(surahNumber)) {

                while (surahNumber > quranData.length) {
                    quranData.push([]);
                }

                quranData[surahNumber - 1].push(ayahText);

            }

        } else {

            /*
            إذا كان الملف لا يحتوي على أرقام السور،
            نستخدم عدد الآيات المعروف لكل سورة.
            */

            if (!quranData[surahIndex]) {
                quranData[surahIndex] = [];
            }

            quranData[surahIndex].push(line);

            ayahIndex++;

            if (
                surahIndex < ayahCounts.length &&
                ayahIndex >= ayahCounts[surahIndex]
            ) {

                surahIndex++;
                ayahIndex = 0;

                if (!quranData[surahIndex]) {
                    quranData[surahIndex] = [];
                }
            }
        }
    }

    /*
    إزالة أول عنصر فارغ إذا وجد
    */

    if (
        quranData.length > 0 &&
        quranData[0].length === 0
    ) {
        quranData.shift();
    }

}


/*
==================================================
إنشاء قائمة السور
==================================================
*/

function createSurahList(filter = "") {

    const container = document.getElementById("surahs");

    container.innerHTML = "";

    surahNames.forEach((name, index) => {

        if (
            filter &&
            !name.includes(filter)
        ) {
            return;
        }

        const button = document.createElement("button");

        button.className = "surah-button";

        button.innerHTML = `
            <span class="surah-number">
                ${index + 1}
            </span>

            <span class="surah-name">
                سورة ${name}
            </span>
        `;

        button.onclick = () => openSurah(index);

        container.appendChild(button);

    });

}


/*
==================================================
فتح السورة
==================================================
*/

function openSurah(index) {

    if (!quranData[index]) {
        alert("لم يتم العثور على بيانات هذه السورة.");
        return;
    }

    currentSurah = index;

    document.getElementById("surahList").style.display = "none";

    document.getElementById("search").style.display = "none";

    document.getElementById("reader").classList.add("active");

    document.getElementById("surahTitle").textContent =
        "سورة " + surahNames[index];

    document.getElementById("surahInfo").textContent =
        "السورة رقم " + (index + 1) +
        " • " +
        ayahCounts[index] +
        " آية";

    /*
    البسملة لا تظهر في سورة التوبة
    */

    if (index === 8) {
        document.getElementById("basmala").style.display = "none";
    } else {
        document.getElementById("basmala").style.display = "block";
    }

    const quranText =
        document.getElementById("quranText");

    quranText.innerHTML = "";

    const ayahs = quranData[index];

    ayahs.forEach((ayah, i) => {

        const span = document.createElement("span");

        span.className = "ayah";

        span.textContent = ayah + " ";

        const number =
            document.createElement("span");

        number.className = "ayah-number";

        number.textContent = i + 1;

        quranText.appendChild(span);

        quranText.appendChild(number);

    });

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/*
==================================================
العودة إلى قائمة السور
==================================================
*/

function showSurahList() {

    document.getElementById("reader")
        .classList.remove("active");

    document.getElementById("surahList")
        .style.display = "block";

    document.getElementById("search")
        .style.display = "block";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/*
==================================================
السورة السابقة
==================================================
*/

function previousSurah() {

    if (currentSurah > 0) {
        openSurah(currentSurah - 1);
    }

}


/*
==================================================
السورة التالية
==================================================
*/

function nextSurah() {

    if (currentSurah < 113) {
        openSurah(currentSurah + 1);
    }

}


/*
==================================================
البحث عن سورة
==================================================
*/

function searchSurah() {

    const value =
        document.getElementById("search")
        .value
        .trim();

    createSurahList(value);

}


/*
==================================================
تشغيل البرنامج
==================================================
*/

loadQuran();

</script>
