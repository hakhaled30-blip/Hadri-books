<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>القرآن الكريم - حضري للكتب الإسلامية</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f5f7f6;
    color:#222;
    font-family:Tahoma,Arial,sans-serif;
}

header{
    background:#0f5132;
    color:#fff;
    text-align:center;
    padding:25px 15px;
}

header h1{
    margin:0 0 8px;
    font-size:28px;
}

header p{
    margin:0;
    opacity:.9;
}

.topbar{
    width:94%;
    max-width:1050px;
    margin:20px auto 12px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.topbar a,
.topbar button{
    border:0;
    text-decoration:none;
    padding:11px 18px;
    border-radius:9px;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

.home{
    background:#0f5132;
    color:#fff;
}

.save{
    background:#e7eee9;
    color:#0f5132;
    border:1px solid #cbdacf !important;
}

.search{
    width:94%;
    max-width:1050px;
    margin:0 auto 15px;
}

.search input{
    width:100%;
    padding:13px 15px;
    border:1px solid #ddd;
    border-radius:9px;
    font-size:16px;
    outline:none;
}

.surah-list{
    width:94%;
    max-width:1050px;
    margin:0 auto 25px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:9px;
}

.surah-btn{
    background:#fff;
    color:#0f5132;
    border:1px solid #ddd;
    border-radius:9px;
    padding:12px 8px;
    cursor:pointer;
    font-size:16px;
}

.surah-btn:hover{
    background:#edf5f0;
}

.surah-btn.active{
    background:#0f5132;
    color:#fff;
}

.reader{
    width:94%;
    max-width:1050px;
    margin:0 auto 35px;
}

.surah{
    display:none;
    background:#fff;
    border-radius:15px;
    padding:25px 20px 30px;
    box-shadow:0 3px 14px rgba(0,0,0,.06);
}

.surah.active{
    display:block;
}

.surah-header{
    text-align:center;
    margin-bottom:20px;
}

.surah-header h2{
    margin:0 0 8px;
    color:#0f5132;
    font-size:28px;
}

.surah-header p{
    margin:0;
    color:#777;
    font-size:15px;
}

.basmala{
    text-align:center;
    font-family:"Traditional Arabic","Amiri",serif;
    font-size:30px;
    line-height:2.2;
    margin:10px 0 20px;
}

.quran-text{
    font-family:"Traditional Arabic","Amiri","Scheherazade New",serif;
    font-size:30px;
    line-height:2.25;
    text-align:justify;
    direction:rtl;
}

.ayah{
    display:inline;
    padding:0;
    margin:0;
    background:none !important;
    border:0 !important;
    box-shadow:none !important;
}

.ayah-number{
    display:inline;
    white-space:nowrap;
}

.save-marker{
    display:none;
    text-align:center;
    margin:20px 0;
    padding:10px;
    background:#edf5f0;
    color:#0f5132;
    border-radius:8px;
    font-size:14px;
}

.save-marker.show{
    display:block;
}

.navigation{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:30px;
}

.nav-btn{
    border:0;
    background:#0f5132;
    color:#fff;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.nav-btn:disabled{
    background:#ccc;
    cursor:not-allowed;
}

.loading,
.error{
    width:94%;
    max-width:1050px;
    margin:30px auto;
    background:#fff;
    border-radius:12px;
    padding:30px;
    text-align:center;
}

.error{
    color:#a33;
}

footer{
    background:#0f5132;
    color:#fff;
    text-align:center;
    padding:20px;
    line-height:1.8;
}

@media(max-width:600px){

    header h1{
        font-size:24px;
    }

    .surah-list{
        grid-template-columns:repeat(2,1fr);
    }

    .surah{
        padding:20px 13px 25px;
    }

    .quran-text{
        font-size:26px;
        line-height:2.2;
    }

    .basmala{
        font-size:27px;
    }

    .surah-header h2{
        font-size:25px;
    }
}
</style>
</head>

<body>

<header>
    <h1>📖 القرآن الكريم</h1>
    <p>المصحف الشريف بالرسم العثماني</p>
</header>

<div class="topbar">

    <a href="index.html" class="home">
        ← الرئيسية
    </a>

    <button class="save" id="saveButton">
        📍 حفظ موضع القراءة
    </button>

    <button class="save" id="resumeButton">
        ▶ متابعة القراءة
    </button>

</div>

<div class="search">
    <input
        type="search"
        id="searchInput"
        placeholder="🔎 ابحث عن اسم السورة..."
        autocomplete="off">
</div>

<div id="surahList" class="surah-list"></div>

<div id="reader" class="reader">

    <div class="loading">
        جاري تحميل القرآن الكريم...
    </div>

</div>

<footer>
    © 2026 حضري للكتب الإسلامية
    <br>
    مكتبة إلكترونية إسلامية
</footer>

<script>

const QURAN_FILE = "quran-uthmani.txt";

const surahNames = [
"الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام",
"الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد",
"إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه",
"الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء",
"النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب",
"سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت",
"الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح",
"الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن",
"الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف",
"الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك",
"القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر",
"القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس",
"التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق",
"الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى",
"الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات",
"القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون",
"الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"
];

let quran = [];
let currentSurah = 0;

/* =========================
   قراءة ملف القرآن
========================= */

function parseQuran(text){

    const result = Array.from(
        {length:114},
        () => []
    );

    const lines = text
        .split(/\r?\n/)
        .map(x => x.trim())
        .filter(Boolean);

    for(const line of lines){

        const parts = line.split("|");

        if(parts.length < 3) continue;

        const surah = parseInt(parts[0]);
        const ayah = parseInt(parts[1]);

        if(
            !Number.isInteger(surah) ||
            !Number.isInteger(ayah) ||
            surah < 1 ||
            surah > 114
        ){
            continue;
        }

        const textValue =
            parts.slice(2).join("|").trim();

        if(!textValue) continue;

        result[surah - 1].push({
            number:ayah,
            text:textValue
        });
    }

    return result;
}

/* =========================
   أسماء السور
========================= */

function createSurahList(){

    const list =
        document.getElementById("surahList");

    list.innerHTML = "";

    surahNames.forEach((name,index)=>{

        const button =
            document.createElement("button");

        button.className = "surah-btn";

        button.dataset.name = name;

        button.textContent =
            (index + 1) + " - " + name;

        button.onclick = function(){

            openSurah(index);

        };

        list.appendChild(button);

    });
}

/* =========================
   إنشاء صفحات السور
========================= */

function renderQuran(){

    const reader =
        document.getElementById("reader");

    reader.innerHTML = "";

    quran.forEach((ayahs,index)=>{

        const section =
            document.createElement("section");

        section.className = "surah";

        section.id =
            "surah-" + (index + 1);

        /* عنوان السورة */

        const header =
            document.createElement("div");

        header.className = "surah-header";

        header.innerHTML =
            "<h2>سورة " +
            surahNames[index] +
            "</h2>" +
            "<p>السورة " +
            (index + 1) +
            " من 114</p>";

        section.appendChild(header);

        /* البسملة */

        if(index !== 8){

            const basmala =
                document.createElement("div");

            basmala.className = "basmala";

            basmala.textContent =
                "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ";

            section.appendChild(basmala);
        }

        /* النص */

        const text =
            document.createElement("div");

        text.className = "quran-text";

        ayahs.forEach(ayah=>{

            const span =
                document.createElement("span");

            span.className = "ayah";

            span.dataset.surah =
                index + 1;

            span.dataset.ayah =
                ayah.number;

            /*
              رقم الآية بين قوسين
              وليس في بداية الآية
            */

            span.textContent =
                ayah.text +
                " (" +
                ayah.number +
                ") ";

            text.appendChild(span);

        });

        section.appendChild(text);

        /* رسالة الحفظ */

        const marker =
            document.createElement("div");

        marker.className =
            "save-marker";

        marker.id =
            "marker-" + (index + 1);

        marker.textContent =
            "✓ تم حفظ موضع القراءة في هذه السورة";

        section.appendChild(marker);

        /* أزرار التنقل */

        const navigation =
            document.createElement("div");

        navigation.className =
            "navigation";

        const previous =
            document.createElement("button");

        previous.className =
            "nav-btn";

        previous.textContent =
            "→ السابقة";

        previous.disabled =
            index === 0;

        previous.onclick = function(){

            openSurah(index - 1);

        };

        const next =
            document.createElement("button");

        next.className =
            "nav-btn";

        next.textContent =
            "التالية ←";

        next.disabled =
            index === 113;

        next.onclick = function(){

            openSurah(index + 1);

        };

        navigation.appendChild(previous);
        navigation.appendChild(next);

        section.appendChild(navigation);

        reader.appendChild(section);

    });
}

/* =========================
   فتح سورة
========================= */

function openSurah(index){

    if(index < 0 || index > 113){
        return;
    }

    currentSurah = index;

    document
        .querySelectorAll(".surah")
        .forEach(section=>{
            section.classList.remove("active");
        });

    document
        .querySelectorAll(".surah-btn")
        .forEach(button=>{
            button.classList.remove("active");
        });

    const section =
        document.getElementById(
            "surah-" + (index + 1)
        );

    if(section){
        section.classList.add("active");
    }

    const button =
        document.querySelectorAll(
            ".surah-btn"
        )[index];

    if(button){
        button.classList.add("active");
    }

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

/* =========================
   حفظ موضع القراءة
========================= */

function saveReadingPosition(){

    const data = {
        surah: currentSurah + 1,
        scroll:
            window.scrollY
    };

    localStorage.setItem(
        "quranReadingPosition",
        JSON.stringify(data)
    );

    document
        .querySelectorAll(".save-marker")
        .forEach(marker=>{
            marker.classList.remove("show");
        });

    const marker =
        document.getElementById(
            "marker-" + (currentSurah + 1)
        );

    if(marker){
        marker.classList.add("show");
    }

    alert("تم حفظ موضع القراءة بنجاح ✓");
}

/* =========================
   متابعة القراءة
========================= */

function resumeReading(){

    const saved =
        localStorage.getItem(
            "quranReadingPosition"
        );

    if(!saved){

        alert(
            "لا يوجد موضع قراءة محفوظ بعد."
        );

        return;
    }

    try{

        const data =
            JSON.parse(saved);

        if(
            data.surah < 1 ||
            data.surah > 114
        ){
            return;
        }

        openSurah(
            data.surah - 1
        );

        setTimeout(()=>{

            window.scrollTo({
                top:data.scroll || 0,
                behavior:"smooth"
            });

        },150);

    }catch(error){

        localStorage.removeItem(
            "quranReadingPosition"
        );

        alert(
            "تعذر قراءة الموضع المحفوظ."
        );
    }
}

/* =========================
   البحث عن السور
========================= */

document
.getElementById("searchInput")
.addEventListener("input",function(){

    const value =
        this.value.trim();

    document
        .querySelectorAll(".surah-btn")
        .forEach(button=>{

            const name =
                button.dataset.name;

            button.style.display =
                !value ||
                name.includes(value)
                ? ""
                : "none";

        });

});

/* =========================
   الأزرار
========================= */

document
.getElementById("saveButton")
.addEventListener(
    "click",
    saveReadingPosition
);

document
.getElementById("resumeButton")
.addEventListener(
    "click",
    resumeReading
);

/* =========================
   تحميل القرآن
========================= */

async function loadQuran(){

    try{

        const response =
            await fetch(QURAN_FILE);

        if(!response.ok){

            throw new Error(
                "لم يتم العثور على quran-uthmani.txt"
            );

        }

        const text =
            await response.text();

        quran =
            parseQuran(text);

        const total =
            quran.reduce(
                (sum,arr)=>
                    sum + arr.length,
                0
            );

        if(total === 0){

            throw new Error(
                "صيغة ملف القرآن غير صحيحة"
            );

        }

        createSurahList();

        renderQuran();

        const saved =
            localStorage.getItem(
                "quranReadingPosition"
            );

        if(saved){

            try{

                const data =
                    JSON.parse(saved);

                if(
                    data.surah >= 1 &&
                    data.surah <= 114
                ){

                    openSurah(
                        data.surah - 1
                    );

                }else{

                    openSurah(0);

                }

            }catch(e){

                openSurah(0);

            }

        }else{

            openSurah(0);

        }

    }catch(error){

        console.error(error);

        document.getElementById("reader").innerHTML =
            '<div class="error">' +
            'تعذر تحميل القرآن الكريم.<br><br>' +
            'تأكد من وجود الملف ' +
            '<b>quran-uthmani.txt</b> ' +
            'في نفس مجلد <b>quran.html</b>.' +
            '</div>';

    }

}

loadQuran();

</script>

</body>
</html>
