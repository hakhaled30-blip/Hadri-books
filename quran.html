<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>القرآن الكريم</title>

<style>

/* =========================
   الأساس
========================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #f8f6f0;
    color: #29251f;
    font-family: Arial, Tahoma, sans-serif;
}


/* =========================
   رأس الموقع
========================= */

.header {
    background: linear-gradient(135deg, #173f35, #286052);
    color: #fff;
    text-align: center;
    padding: 28px 15px 24px;
    box-shadow: 0 3px 12px rgba(0,0,0,.12);
}

.header h1 {
    margin: 0;
    font-family: "Traditional Arabic", "Amiri", serif;
    font-size: 38px;
    font-weight: normal;
}

.header p {
    margin: 7px 0 0;
    font-size: 14px;
    opacity: .9;
}


/* =========================
   البحث
========================= */

.search-area {
    max-width: 850px;
    margin: 22px auto;
    padding: 0 15px;
}

.search-box {
    width: 100%;
    height: 52px;
    border: 1px solid #ddd7ca;
    border-radius: 14px;
    background: #fff;
    padding: 0 18px;
    font-size: 16px;
    outline: none;
    direction: rtl;
}

.search-box:focus {
    border-color: #286052;
    box-shadow: 0 0 0 3px rgba(40,96,82,.08);
}


/* =========================
   قائمة السور
========================= */

.surah-list {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 15px 50px;
}

.surah-list h2 {
    margin: 15px 0;
    color: #173f35;
    font-size: 21px;
    font-weight: normal;
}

.surahs {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.surah-button {
    width: 100%;
    border: 1px solid #e1dbcf;
    background: #fff;
    border-radius: 13px;
    padding: 13px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    text-align: right;
    transition: .2s;
}

.surah-button:hover {
    border-color: #286052;
    transform: translateY(-1px);
    box-shadow: 0 5px 15px rgba(0,0,0,.06);
}

.surah-number {
    width: 36px;
    height: 36px;
    min-width: 36px;
    border-radius: 50%;
    background: #edf3f0;
    color: #286052;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
}

.surah-name {
    font-family: "Traditional Arabic", "Amiri", serif;
    font-size: 22px;
    color: #29251f;
}


/* =========================
   قارئ القرآن
========================= */

.reader {
    display: none;
    max-width: 920px;
    margin: 0 auto;
    padding: 15px 15px 60px;
}

.reader.active {
    display: block;
}


/* =========================
   زر العودة
========================= */

.back-button {
    display: block;
    margin: 0 auto 15px;
    border: 1px solid #ddd6ca;
    background: #fff;
    color: #286052;
    border-radius: 10px;
    padding: 10px 22px;
    font-size: 15px;
    cursor: pointer;
}


/* =========================
   عنوان السورة
========================= */

.surah-header {
    text-align: center;
    padding: 15px 10px 20px;
}

.surah-header h2 {
    margin: 0;
    color: #173f35;
    font-family: "Traditional Arabic", "Amiri", serif;
    font-size: 40px;
    font-weight: normal;
}

.surah-header p {
    margin: 7px 0 0;
    color: #777;
    font-size: 13px;
}


/* =========================
   نص القرآن
========================= */

.quran-text {
    width: 100%;
    padding: 10px 8px 30px;
    text-align: right;
}


/*
   كل آية نص طبيعي.
   لا يوجد مربع حول الآيات.
*/

.ayah {
    font-family: "Traditional Arabic", "Amiri", serif;
    font-size: 31px;
    line-height: 2.35;
    color: #25221e;
}


/* =========================
   أرقام الآيات
========================= */

.ayah-number {
    color: #286052;
    font-family: "Traditional Arabic", "Amiri", serif;
    font-size: 27px;
    white-space: nowrap;
    margin: 0 5px;
}


/* =========================
   فاصل بسيط
========================= */

.ayah-space {
    display: inline;
}


/* =========================
   التنقل
========================= */

.navigation {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

.nav-button {
    flex: 1;
    border: none;
    background: #286052;
    color: #fff;
    border-radius: 11px;
    padding: 13px;
    font-size: 15px;
    cursor: pointer;
}

.nav-button:hover {
    background: #173f35;
}


/* =========================
   الخطأ
========================= */

.error {
    background: #fff;
    border: 1px solid #e2dcd1;
    border-radius: 14px;
    padding: 25px;
    text-align: center;
    color: #a33;
}


/* =========================
   الهاتف
========================= */

@media (max-width: 600px) {

    .header {
        padding: 23px 12px;
    }

    .header h1 {
        font-size: 32px;
    }

    .surahs {
        grid-template-columns: 1fr;
    }

    .reader {
        padding-left: 10px;
        padding-right: 10px;
    }

    .surah-header h2 {
        font-size: 34px;
    }

    .quran-text {
        padding-left: 2px;
        padding-right: 2px;
    }

    .ayah {
        font-size: 27px;
        line-height: 2.35;
    }

    .ayah-number {
        font-size: 24px;
        margin-left: 4px;
        margin-right: 4px;
    }

}


/* =========================
   الوضع الليلي
========================= */

.dark {
    background: #151918;
    color: #eee;
}

.dark .search-box,
.dark .surah-button,
.dark .back-button {
    background: #202624;
    border-color: #343c39;
    color: #eee;
}

.dark .surah-name {
    color: #eee;
}

.dark .surah-list h2,
.dark .surah-header h2 {
    color: #b9d8cc;
}

.dark .ayah {
    color: #eee;
}

.dark .ayah-number {
    color: #8fc6b3;
}

</style>

</head>


<body>


<!-- =========================
     الرأس
========================= -->

<header class="header">

    <h1>القرآن الكريم</h1>

    <p>
        قراءة القرآن الكريم بالرسم العثماني
    </p>

</header>


<!-- =========================
     البحث
========================= -->

<section
    id="searchArea"
    class="search-area"
>

    <input
        id="search"
        class="search-box"
        type="text"
        placeholder="ابحث عن سورة..."
        autocomplete="off"
    >

</section>


<!-- =========================
     قائمة السور
========================= -->

<section
    id="surahList"
    class="surah-list"
>

    <h2>سور القرآن الكريم</h2>

    <div
        id="surahs"
        class="surahs"
    ></div>

</section>


<!-- =========================
     القارئ
========================= -->

<section
    id="reader"
    class="reader"
>


    <button
        id="backButton"
        class="back-button"
    >
        ← العودة إلى قائمة السور
    </button>


    <div class="surah-header">

        <h2 id="surahTitle"></h2>

        <p id="surahInfo"></p>

    </div>


    <div
        id="quranText"
        class="quran-text"
    ></div>


    <div class="navigation">

        <button
            id="previousButton"
            class="nav-button"
        >
            السورة السابقة
        </button>

        <button
            id="nextButton"
            class="nav-button"
        >
            السورة التالية
        </button>

    </div>


</section>


<script>

/* ==================================================
   أسماء السور
================================================== */

const surahNames = [

"الفاتحة",
"البقرة",
"آل عمران",
"النساء",
"المائدة",
"الأنعام",
"الأعراف",
"الأنفال",

"الرعد",

"الحجر",

"الإسراء",
"الكهف",
"مريم",
"طه",
"الأنبياء",
"الحج",
"المؤمنون",
"النور",
"الفرقان",
"الشعراء",
"النمل",
"القصص",
"العنكبوت",
"الروم",
"لقمان",
"السجدة",
"الأحزاب",
"سبأ",
"فاطر",
"يس",
"الصافات",
"ص",
"الزمر",
"غافر",
"فصلت",
"الشورى",
"الزخرف",
"الدخان",
"الجاثية",
"الأحقاف",
"محمد",
"الفتح",
"الحجرات",
"ق",
"الذاريات",

"النجم",

"الرحمن",
"الواقعة",
"الحديد",

"الحشر",

"الصف",

"المنافقون",
"التغابن",
"الطلاق",
"التحريم",
"الملك",
"القلم",
"الحاقة",
"المعارج",
"نوح",
"الجن",
"المزمل",
"المدثر",
"القيامة",
"الإنسان",
"المرسلات",
"النبأ",
"النازعات",
"عبس",
"التكوير",
"الانفطار",
"المطففين",
"الانشقاق",
"البروج",
"الطارق",
"الأعلى",
"الغاشية",
"الفجر",
"البلد",
"الشمس",
"الليل",
"الضحى",
"الشرح",
"التين",
"العلق",
"القدر",
"البينة",
"الزلزلة",
"العاديات",
"القارعة",
"التكاثر",
"العصر",
"الهمزة",
"الفيل",
"قريش",
"الماعون",
"الكوثر",
"الكافرون",
"النصر",
"المسد",
"الإخلاص",
"الفلق",
"الناس"

];


/* ==================================================
   عدد الآيات
================================================== */

const ayahCounts = [

7,286,200,176,120,165,206,75,129,109,
123,111,43,52,99,128,111,110,98,135,
112,78,118,64,77,227,93,88,69,60,
34,30,73,54,45,83,182,88,75,85,
54,53,89,59,37,35,38,29,18,45,
60,49,62,55,78,96,29,22,24,13,
14,11,11,18,12,12,30,52,52,44,
28,28,20,56,40,31,50,40,46,42,
29,19,36,25,22,17,19,26,30,20,
15,21,11,8,8,19,5,8,8,11,
11,8,3,9,5,4,7,3,6,3,
5,4,5,6

];


/* ==================================================
   المتغيرات
================================================== */

let quranData = [];

let currentSurah = 0;


/* ==================================================
   تحويل الأرقام إلى عربية
================================================== */

function arabicNumber(number) {

    const digits = [
        "٠",
        "١",
        "٢",
        "٣",
        "٤",
        "٥",
        "٦",
        "٧",
        "٨",
        "٩"
    ];

    return String(number)
        .split("")
        .map(function(digit) {
            return digits[parseInt(digit)];
        })
        .join("");

}


/* ==================================================
   قراءة ملف quran-uthmani.txt
================================================== */

function parseQuran(text) {

    /*
    مهم جدًا:

    ملفك ظهر بهذا الشكل:

    1|بِسْمِ...
    2|الْحَمْدُ...
    3|الرَّحْمَنُ...

    وفي بعض الهواتف قد تظهر الأسطر
    متلاصقة عند العرض.

    لذلك لا نعتمد على نهاية السطر.

    نعتمد على العلامة:
    
    رقم + |

    مثل:

    1|
    2|
    3|
    */

    quranData = [];

    for (
        let i = 0;
        i < 114;
        i++
    ) {

        quranData.push([]);

    }


    /*
    إزالة جزء حقوق النشر بالكامل
    */

    let cleanText = text.split("#")[0];


    /*
    العثور على جميع علامات الآيات
    */

    const markerRegex = /(\d+)\|/g;

    let markers = [];

    let match;


    while (
        (match = markerRegex.exec(cleanText))
        !== null
    ) {

        markers.push({

            number:
                parseInt(match[1]),

            start:
                match.index,

            contentStart:
                markerRegex.lastIndex

        });

    }


    /*
    استخراج النص بين كل علامة والتي بعدها
    */

    let verses = [];


    for (
        let i = 0;
        i < markers.length;
        i++
    ) {

        let start =
            markers[i].contentStart;


        let end =
            i + 1 < markers.length
                ? markers[i + 1].start
                : cleanText.length;


        let verse =
            cleanText
            .substring(start, end)
            .replace(/\r/g, " ")
            .replace(/\n/g, " ")
            .trim();


        /*
        إزالة أي رقم| بقي بالخطأ
        في بداية النص
        */

        verse =
            verse.replace(
                /^\d+\|/,
                ""
            ).trim();


        /*
        تنظيف المسافات الزائدة
        */

        verse =
            verse.replace(
                /\s+/g,
                " "
            );


        if (verse.length > 0) {

            verses.push({
                number:
                    markers[i].number,

                text:
                    verse
            });

        }

    }


    /*
    ==============================================
    توزيع الآيات على السور
    ==============================================

    لا نستخدم الرقم الموجود في الملف
    كرقم للسورة.

    نستخدم ترتيب الآيات وعدد آيات
    كل سورة.
    */

    let versePosition = 0;


    for (
        let surah = 0;
        surah < 114;
        surah++
    ) {

        let count =
            ayahCounts[surah];


        for (
            let ayah = 0;
            ayah < count;
            ayah++
        ) {

            if (
                versePosition >=
                verses.length
            ) {

                break;

            }


            /*
            نضع النص فقط.

            لا نضع:
            1|
            2|
            3|

            لأن هذه العلامة من الملف
            وليست جزءًا من نص الآية.
            */

            quranData[surah].push({

                text:
                    verses[versePosition].text

            });


            versePosition++;

        }

    }

}


/* ==================================================
   إنشاء قائمة السور
================================================== */

function createSurahList(searchText = "") {

    const container =
        document.getElementById("surahs");


    container.innerHTML = "";


    surahNames.forEach(
        function(name, index) {

            if (
                searchText &&
                !name.includes(searchText)
            ) {

                return;

            }


            const button =
                document.createElement("button");


            button.className =
                "surah-button";


            button.innerHTML = `

                <span class="surah-number">
                    ${arabicNumber(index + 1)}
                </span>

                <span class="surah-name">
                    سورة ${name}
                </span>

            `;


            button.addEventListener(
                "click",
                function() {

                    openSurah(index);

                }
            );


            container.appendChild(button);

        }
    );

}


/* ==================================================
   فتح السورة
================================================== */

function openSurah(index) {

    currentSurah = index;


    const ayahs =
        quranData[index];


    if (
        !ayahs ||
        ayahs.length === 0
    ) {

        alert(
            "لم يتم تحميل آيات هذه السورة. تأكد من ملف quran-uthmani.txt."
        );

        return;

    }


    document
        .getElementById("surahList")
        .style.display = "none";


    document
        .getElementById("searchArea")
        .style.display = "none";


    document
        .getElementById("reader")
        .classList.add("active");


    document
        .getElementById("surahTitle")
        .textContent =
        "سورة " +
        surahNames[index];


    document
        .getElementById("surahInfo")
        .textContent =

        "السورة رقم " +
        arabicNumber(index + 1) +
        " • " +
        arabicNumber(ayahs.length) +
        " آية";


    const quranText =
        document.getElementById(
            "quranText"
        );


    quranText.innerHTML = "";


    /*
    ==============================================
    عرض الآيات
    ==============================================

    هنا نعرض النص الموجود في الملف فقط.

    ثم نضيف رقم الآية مرة واحدة.

    لا نضيف أي مربع.
    */

    ayahs.forEach(
        function(ayah, index) {

            const text =
                document.createElement(
                    "span"
                );


            text.className =
                "ayah";


            text.textContent =
                ayah.text + " ";


            quranText.appendChild(text);


            const number =
                document.createElement(
                    "span"
                );


            number.className =
                "ayah-number";


            number.textContent =

                "﴿" +
                arabicNumber(index + 1) +
                "﴾";


            quranText.appendChild(number);


            const space =
                document.createTextNode(" ");


            quranText.appendChild(space);

        }
    );


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* ==================================================
   العودة إلى قائمة السور
================================================== */

function showSurahList() {

    document
        .getElementById("reader")
        .classList.remove("active");


    document
        .getElementById("surahList")
        .style.display = "block";


    document
        .getElementById("searchArea")
        .style.display = "block";


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* ==================================================
   السورة السابقة
================================================== */

function previousSurah() {

    if (currentSurah > 0) {

        openSurah(
            currentSurah - 1
        );

    }

}


/* ==================================================
   السورة التالية
================================================== */

function nextSurah() {

    if (currentSurah < 113) {

        openSurah(
            currentSurah + 1
        );

    }

}


/* ==================================================
   البحث
================================================== */

function searchSurah() {

    const value =
        document
        .getElementById("search")
        .value
        .trim();


    createSurahList(value);

}


/* ==================================================
   الأحداث
================================================== */

document
    .getElementById("backButton")
    .addEventListener(
        "click",
        showSurahList
    );


document
    .getElementById("previousButton")
    .addEventListener(
        "click",
        previousSurah
    );


document
    .getElementById("nextButton")
    .addEventListener(
        "click",
        nextSurah
    );


document
    .getElementById("search")
    .addEventListener(
        "input",
        searchSurah
    );


/* ==================================================
   تحميل ملف القرآن
================================================== */

fetch("quran-uthmani.txt")

    .then(function(response) {

        if (!response.ok) {

            throw new Error(
                "File not found"
            );

        }

        return response.text();

    })

    .then(function(text) {

        parseQuran(text);

        createSurahList();

    })

    .catch(function(error) {

        document.getElementById(
            "surahs"
        ).innerHTML = `

            <div class="error">

                <strong>
                    تعذر تحميل القرآن
                </strong>

                <br><br>

                تأكد أن الملف:

                <br><br>

                <b>
                    quran-uthmani.txt
                </b>

                <br><br>

                موجود في نفس مجلد
                index.html.

            </div>

        `;

    });

</script>
