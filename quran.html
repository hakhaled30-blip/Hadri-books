<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>القرآن الكريم</title>

<style>

/* =========================
   الصفحة
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f8f6f0;
    color: #29251f;
    font-family: Tahoma, Arial, sans-serif;
}


/* =========================
   رأس الصفحة
========================= */

.header {
    background: linear-gradient(135deg, #174238, #286050);
    color: white;
    text-align: center;
    padding: 25px 15px;
}

.header h1 {
    margin: 0;
    font-family: "Traditional Arabic", "Amiri", serif;
    font-size: 36px;
}

.header p {
    margin: 6px 0 0;
    font-size: 14px;
}


/* =========================
   البحث
========================= */

.search-area {
    max-width: 850px;
    margin: 20px auto;
    padding: 0 15px;
}

.search-box {
    width: 100%;
    padding: 14px 18px;
    border: 1px solid #ddd8cc;
    border-radius: 12px;
    background: white;
    font-size: 16px;
    outline: none;
}


/* =========================
   قائمة السور
========================= */

.surah-list {
    max-width: 850px;
    margin: auto;
    padding: 0 15px 40px;
}

.surah-list h2 {
    color: #174238;
    font-size: 21px;
}

.surahs {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.surah-button {
    background: white;
    border: 1px solid #e3ddd1;
    border-radius: 12px;
    padding: 13px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    text-align: right;
}

.surah-button:hover {
    border-color: #286050;
}

.surah-number {
    width: 34px;
    height: 34px;
    min-width: 34px;
    border-radius: 50%;
    background: #edf3f0;
    color: #286050;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
}

.surah-name {
    font-family: "Traditional Arabic", "Amiri", serif;
    font-size: 21px;
}


/* =========================
   القارئ
========================= */

.reader {
    display: none;
    max-width: 900px;
    margin: 20px auto;
    padding: 0 15px 50px;
}

.reader.active {
    display: block;
}


/* =========================
   العودة
========================= */

.back-button {
    display: block;
    margin: 0 auto 20px;
    padding: 9px 22px;
    background: white;
    border: 1px solid #ddd5c8;
    border-radius: 10px;
    color: #286050;
    cursor: pointer;
}


/* =========================
   عنوان السورة
========================= */

.surah-header {
    text-align: center;
    padding: 20px 10px;
    margin-bottom: 15px;
}

.surah-header h2 {
    margin: 0;
    color: #174238;
    font-family: "Traditional Arabic", "Amiri", serif;
    font-size: 38px;
}

.surah-header p {
    color: #777;
    margin-top: 6px;
    font-size: 13px;
}


/* =========================
   البسملة
========================= */

.basmala {
    text-align: center;
    font-family: "Traditional Arabic", "Amiri", serif;
    font-size: 30px;
    color: #286050;
    margin: 10px 0 25px;
}


/* =========================
   نص القرآن
========================= */

/*
   مهم:
   لا يوجد صندوق حول الآيات
*/

.quran-text {
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 5px 10px 30px;
    text-align: right;
}


/* =========================
   الآية
========================= */

.ayah {
    font-family: "Traditional Arabic", "Amiri", serif;
    font-size: 30px;
    line-height: 2.4;
}


/* =========================
   رقم الآية
========================= */

/*
   الرقم الآن بدون مربع
*/

.ayah-number {
    display: inline;
    color: #286050;
    font-family: "Traditional Arabic", "Amiri", serif;
    font-size: 25px;
    margin: 0 5px;
    white-space: nowrap;
}


/* =========================
   التنقل
========================= */

.navigation {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.nav-button {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #286050;
    color: white;
    cursor: pointer;
}


/* =========================
   الهاتف
========================= */

@media (max-width: 600px) {

    .header h1 {
        font-size: 30px;
    }

    .surahs {
        grid-template-columns: 1fr;
    }

    .quran-text {
        padding: 5px 2px 30px;
    }

    .ayah {
        font-size: 26px;
        line-height: 2.4;
    }

    .ayah-number {
        font-size: 23px;
        margin: 0 4px;
    }

    .basmala {
        font-size: 26px;
    }

    .surah-header h2 {
        font-size: 32px;
    }

}

</style>

</head>


<body>


<header class="header">

    <h1>القرآن الكريم</h1>

    <p>
        قراءة القرآن الكريم بالرسم العثماني
    </p>

</header>


<section class="search-area">

    <input
        id="search"
        class="search-box"
        type="text"
        placeholder="ابحث عن سورة..."
        oninput="searchSurah()"
    >

</section>


<section id="surahList" class="surah-list">

    <h2>سور القرآن الكريم</h2>

    <div id="surahs" class="surahs"></div>

</section>


<section id="reader" class="reader">

    <button
        class="back-button"
        onclick="showSurahList()"
    >
        ← العودة إلى السور
    </button>


    <div class="surah-header">

        <h2 id="surahTitle"></h2>

        <p id="surahInfo"></p>

    </div>


    <div id="basmala" class="basmala">
        بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
    </div>


    <div
        id="quranText"
        class="quran-text"
    ></div>


    <div class="navigation">

        <button
            class="nav-button"
            onclick="previousSurah()"
        >
            السورة السابقة
        </button>

        <button
            class="nav-button"
            onclick="nextSurah()"
        >
            السورة التالية
        </button>

    </div>

</section>


<script>


/* =========================
   أسماء السور
========================= */

const surahNames = [
"الفاتحة","البقرة","آل عمران","النساء","المائدة",
"الأنعام","الأعراف","الأنفال","التوبة","يونس",
"هود","يوسف","الرعد","إبراهيم","الحجر",
"النحل","الإسراء","الكهف","مريم","طه",
"الأنبياء","الحج","المؤمنون","النور","الفرقان",
"الشعراء","النمل","القصص","العنكبوت","الروم",
"لقمان","السجدة","الأحزاب","سبأ","فاطر",
"يس","الصافات","ص","الزمر","غافر",
"فصلت","الشورى","الزخرف","الدخان","الجاثية",
"الأحقاف","محمد","الفتح","الحجرات","ق",
"الذاريات","الطور","النجم","القمر","الرحمن",
"الواقعة","الحديد","المجادلة","الحشر","الممتحنة",
"الصف","الجمعة","المنافقون","التغابن","الطلاق",
"التحريم","الملك","القلم","الحاقة","المعارج",
"نوح","الجن","المزمل","المدثر","القيامة",
"الإنسان","المرسلات","النبأ","النازعات","عبس",
"التكوير","الانفطار","المطففين","الانشقاق","البروج",
"الطارق","الأعلى","الغاشية","الفجر","البلد",
"الشمس","الليل","الضحى","الشرح","التين",
"العلق","القدر","البينة","الزلزلة","العاديات",
"القارعة","التكاثر","العصر","الهمزة","الفيل",
"قريش","الماعون","الكوثر","الكافرون","النصر",
"المسد","الإخلاص","الفلق","الناس"
];


/* =========================
   عدد آيات السور
========================= */

const ayahCounts = [
7,286,200,176,120,165,206,75,129,109,
123,111,43,52,99,128,111,110,98,135,
112,78,118,64,77,227,93,88,69,60,
34,30,73,54,45,83,182,88,75,85,
54,53,89,59,37,35,38,29,18,45,
60,49,62,55,78,96,29,22,24,13,
14,11,11,18,12,12,30,52,52,44,
28,28,20,56,40,31,50,40,46,42,
29,19,36,25,22,17,19,26,30,20,
15,21,11,8,8,19,5,8,8,11,
11,8,3,9,5,4,7,3,6,3,
5,4,5,6
];


let quranData = [];

let currentSurah = 0;


/* =========================
   تحويل الأرقام إلى عربية
========================= */

function arabicNumber(number) {

    const numbers = [
        "٠","١","٢","٣","٤",
        "٥","٦","٧","٨","٩"
    ];

    return String(number)
        .split("")
        .map(n => numbers[n])
        .join("");

}


/* =========================
   تحميل القرآن
========================= */

async function loadQuran() {

    try {

        const response =
            await fetch("quran-uthmani.txt");

        if (!response.ok) {

            throw new Error();

        }

        const text =
            await response.text();

        parseQuran(text);

        createSurahList();

    }

    catch (error) {

        document.getElementById("surahs").innerHTML =

        "<div class='error'>تعذر تحميل ملف القرآن</div>";

    }

}


/* =========================
   قراءة ملف Tanzil
========================= */

function parseQuran(text) {

    quranData = [];

    for (let i = 0; i < 114; i++) {

        quranData.push([]);

    }


    /*
       نبحث عن كل:

       رقم|نص الآية

       سواء كانت الآيات في أسطر
       أو كانت متلاصقة في السطر نفسه.
    */

    const regex =
        /(\d+)\|([\s\S]*?)(?=\s+\d+\||\r?\n|#|$)/g;


    let matches = [];

    let match;


    while ((match = regex.exec(text)) !== null) {

        let number =
            parseInt(match[1]);

        let verse =
            match[2].trim();


        /*
        تجاهل أسطر الحقوق
        */

        if (
            verse.startsWith("#") ||
            verse.includes("Tanzil Quran Text")
        ) {

            continue;

        }


        if (!verse) {

            continue;

        }


        matches.push({
            number: number,
            text: verse
        });

    }


    /*
       نوزع الآيات حسب عدد آيات كل سورة
    */

    let position = 0;


    for (
        let surah = 0;
        surah < 114;
        surah++
    ) {

        const count =
            ayahCounts[surah];


        for (
            let ayah = 0;
            ayah < count;
            ayah++
        ) {

            if (!matches[position]) {

                break;

            }


            /*
            نأخذ النص فقط.
            الرقم الموجود قبل | لا يظهر.
            */

            quranData[surah].push(
                matches[position].text
            );


            position++;

        }

    }

}


/* =========================
   قائمة السور
========================= */

function createSurahList(filter = "") {

    const container =
        document.getElementById("surahs");

    container.innerHTML = "";


    surahNames.forEach(
        (name, index) => {

            if (
                filter &&
                !name.includes(filter)
            ) {

                return;

            }


            const button =
                document.createElement("button");

            button.className =
                "surah-button";


            button.innerHTML = `

                <span class="surah-number">
                    ${arabicNumber(index + 1)}
                </span>

                <span class="surah-name">
                    سورة ${name}
                </span>

            `;


            button.onclick =
                () => openSurah(index);


            container.appendChild(button);

        }
    );

}


/* =========================
   فتح السورة
========================= */

function openSurah(index) {

    currentSurah = index;


    const ayahs =
        quranData[index];


    if (
        !ayahs ||
        ayahs.length === 0
    ) {

        alert("لم يتم تحميل آيات هذه السورة.");

        return;

    }


    document.getElementById(
        "surahList"
    ).style.display = "none";


    document.getElementById(
        "search"
    ).style.display = "none";


    document.getElementById(
        "reader"
    ).classList.add("active");


    document.getElementById(
        "surahTitle"
    ).textContent =
        "سورة " + surahNames[index];


    document.getElementById(
        "surahInfo"
    ).textContent =

        "السورة رقم " +
        arabicNumber(index + 1) +
        " • " +
        arabicNumber(ayahs.length) +
        " آية";


    /*
    سورة التوبة بدون بسملة
    */

    document.getElementById(
        "basmala"
    ).style.display =
        index === 8 ? "none" : "block";


    const quranText =
        document.getElementById(
            "quranText"
        );


    quranText.innerHTML = "";


    /*
    عرض الآيات
    */

    ayahs.forEach(
        (ayah, i) => {

            const verse =
                document.createElement("span");

            verse.className =
                "ayah";


            verse.textContent =
                ayah + " ";


            quranText.appendChild(
                verse
            );


            /*
            رقم الآية بدون مربع
            */

            const number =
                document.createElement("span");

            number.className =
                "ayah-number";


            number.textContent =
                "﴿" +
                arabicNumber(i + 1) +
                "﴾";


            quranText.appendChild(
                number
            );

        }
    );


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================
   العودة
========================= */

function showSurahList() {

    document.getElementById(
        "reader"
    ).classList.remove("active");


    document.getElementById(
        "surahList"
    ).style.display = "block";


    document.getElementById(
        "search"
    ).style.display = "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================
   السابقة
========================= */

function previousSurah() {

    if (currentSurah > 0) {

        openSurah(
            currentSurah - 1
        );

    }

}


/* =========================
   التالية
========================= */

function nextSurah() {

    if (currentSurah < 113) {

        openSurah(
            currentSurah + 1
        );

    }

}


/* =========================
   البحث
========================= */

function searchSurah() {

    const value =
        document.getElementById(
            "search"
        ).value.trim();


    createSurahList(value);

}


/* =========================
   التشغيل
========================= */

loadQuran();

</script>

</body>

</html>
