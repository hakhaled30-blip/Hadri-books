<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>القرآن الكريم | حضري للكتب الإسلامية</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#f5f7f6;
    color:#222;
    font-family:Tahoma,Arial,sans-serif;
}

header{
    background:#0f5132;
    color:#fff;
    text-align:center;
    padding:28px 15px;
}

header h1{
    margin:0 0 8px;
    font-size:28px;
}

header p{
    margin:0;
    opacity:.9;
}

.container{
    width:94%;
    max-width:950px;
    margin:25px auto;
}

.topbar{
    background:#fff;
    border-radius:14px;
    padding:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
    margin-bottom:20px;
}

.home{
    display:inline-block;
    background:#0f5132;
    color:#fff;
    text-decoration:none;
    padding:10px 18px;
    border-radius:8px;
    font-weight:bold;
    margin-bottom:15px;
}

.search{
    display:flex;
    gap:8px;
}

.search input{
    flex:1;
    padding:13px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    font-family:inherit;
}

.search button{
    border:0;
    background:#0f5132;
    color:#fff;
    padding:0 18px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.surah-list{
    display:none;
    margin-top:12px;
    max-height:300px;
    overflow-y:auto;
    border:1px solid #ddd;
    border-radius:8px;
}

.surah-item{
    padding:12px;
    background:#fff;
    border-bottom:1px solid #eee;
    cursor:pointer;
}

.surah-item:hover{
    background:#eef5f1;
}

.resume-box{
    display:none;
    background:#fff;
    border:1px solid #d9e4de;
    border-radius:14px;
    padding:15px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.resume-title{
    color:#0f5132;
    font-weight:bold;
    margin-bottom:8px;
}

.resume-button{
    border:0;
    background:#0f5132;
    color:#fff;
    padding:11px 18px;
    border-radius:8px;
    cursor:pointer;
    font-family:inherit;
    font-weight:bold;
}

.clear-button{
    border:0;
    background:#eee;
    color:#555;
    padding:11px 15px;
    border-radius:8px;
    cursor:pointer;
    font-family:inherit;
    margin-right:6px;
}

.surah-card{
    background:#fff;
    border-radius:16px;
    box-shadow:0 4px 16px rgba(0,0,0,.08);
    overflow:hidden;
}

.surah-header{
    background:#0f5132;
    color:#fff;
    text-align:center;
    padding:25px 15px;
}

.surah-header h2{
    margin:0 0 8px;
    font-size:29px;
}

.surah-header p{
    margin:0;
}

.bismillah{
    text-align:center;
    font-size:28px;
    line-height:2;
    margin:25px 10px 10px;
    font-family:"Noto Naskh Arabic",Tahoma,Arial,sans-serif;
}

.ayahs{
    padding:10px 22px 30px;
}

.ayah{
    position:relative;
    font-family:"Noto Naskh Arabic",Tahoma,Arial,sans-serif;
    font-size:25px;
    line-height:2.35;
    padding:18px 5px;
    border-bottom:1px solid #eee;
}

.ayah:last-child{
    border-bottom:0;
}

.save-row{
    text-align:left;
    margin-top:10px;
}

.save-button{
    border:1px solid #0f5132;
    background:#fff;
    color:#0f5132;
    border-radius:7px;
    padding:7px 12px;
    cursor:pointer;
    font-family:inherit;
    font-size:13px;
}

.save-button.saved{
    background:#0f5132;
    color:#fff;
}

.saved-ayah{
    background:#f1f7f3;
    border-right:4px solid #0f5132;
    padding-right:12px;
    border-radius:6px;
}

.saved-marker{
    display:inline-block;
    color:#0f5132;
    font-weight:bold;
    margin-left:7px;
}

.navigation{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.navigation button{
    flex:1;
    border:0;
    background:#0f5132;
    color:#fff;
    padding:14px;
    border-radius:9px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    font-family:inherit;
}

.navigation button:disabled{
    background:#ccc;
}

.current{
    text-align:center;
    margin:12px 0;
    color:#555;
    font-weight:bold;
}

.loading{
    text-align:center;
    background:#fff;
    padding:30px;
    border-radius:14px;
    color:#0f5132;
    font-weight:bold;
}

.error{
    text-align:center;
    background:#fff;
    padding:30px;
    border-radius:14px;
    color:#a00;
    line-height:2;
}

footer{
    margin-top:35px;
    background:#0f5132;
    color:#fff;
    text-align:center;
    padding:20px;
    line-height:1.8;
}

@media(max-width:600px){

    header h1{
        font-size:24px;
    }

    .search{
        flex-direction:column;
    }

    .search button{
        padding:12px;
    }

    .ayahs{
        padding:8px 13px 20px;
    }

    .ayah{
        font-size:23px;
        line-height:2.3;
    }

    .bismillah{
        font-size:24px;
    }

    .navigation button{
        font-size:14px;
    }
}
</style>
</head>

<body>

<header>
    <h1>📖 القرآن الكريم</h1>
    <p>المصحف الشريف بالرسم العثماني</p>
</header>

<main class="container">

    <div class="topbar">

        <a class="home" href="index.html">🏠 الرئيسية</a>

        <div class="search">
            <input
                id="searchInput"
                type="search"
                placeholder="ابحث عن السورة بالاسم أو الرقم"
                autocomplete="off"
            >
            <button onclick="searchSurah()">بحث</button>
        </div>

        <div id="surahList" class="surah-list"></div>

    </div>

    <div id="resumeBox" class="resume-box">

        <div class="resume-title">
            🔖 لديك موضع قراءة محفوظ
        </div>

        <div id="resumeText"></div>

        <br>

        <button class="resume-button" onclick="resumeReading()">
            ▶ متابعة القراءة
        </button>

        <button class="clear-button" onclick="clearBookmark()">
            مسح الموضع
        </button>

    </div>

    <div id="content" class="loading">
        جاري تحميل القرآن الكريم...
    </div>

</main>

<footer>
    © 2026 حضري للكتب الإسلامية
    <br>
    مكتبة إلكترونية إسلامية
</footer>

<script>

const surahNames = [
"الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام",
"الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد",
"إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه",
"الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء",
"النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب",
"سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى",
"الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات",
"ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة",
"الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة",
"المنافقون","التغابن","الطلاق","التحريم","الملك","القلم",
"الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة",
"الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير",
"الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى",
"الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح",
"التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة",
"التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر",
"الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"
];

const ayahCounts = [
7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,
111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,
54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,
49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,
28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,
20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6
];

let surahs = [];
let currentSurah = 1;
let currentAyah = 1;

const content = document.getElementById("content");
const surahList = document.getElementById("surahList");
const searchInput = document.getElementById("searchInput");
const resumeBox = document.getElementById("resumeBox");
const resumeText = document.getElementById("resumeText");

fetch("quran-uthmani.txt")
.then(response => {

    if(!response.ok){
        throw new Error("quran-uthmani.txt غير موجود");
    }

    return response.text();

})
.then(text => {

    const lines = text
        .replace(/\r/g,"")
        .split("\n")
        .map(x => x.trim())
        .filter(x => x.length);

    let position = 0;

    for(let i=0;i<114;i++){

        let verses = [];

        for(let j=0;j<ayahCounts[i];j++){

            if(position < lines.length){
                verses.push(lines[position]);
                position++;
            }

        }

        surahs.push({
            number:i+1,
            name:surahNames[i],
            verses:verses
        });
    }

    buildSurahList();

    showSurah(1,1);

    showSavedPosition();

})
.catch(error => {

    content.className="error";

    content.innerHTML =
        "تعذر تحميل القرآن الكريم.<br><br>" +
        "تأكد من وجود الملف <b>quran-uthmani.txt</b> بجانب <b>quran.html</b>.";

    console.error(error);
});


function showSurah(number,ayah=1){

    if(!surahs[number-1]) return;

    currentSurah=number;
    currentAyah=ayah;

    const surah=surahs[number-1];

    let html=`
    <section class="surah-card">

        <div class="surah-header">
            <h2>سورة ${surah.name}</h2>
            <p>السورة ${number} من 114</p>
        </div>
    `;

    if(number!==9){

        html+=`
        <div class="bismillah">
            بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
        </div>
        `;
    }

    html+=`<div class="ayahs">`;

    surah.verses.forEach((verse,index)=>{

        const ayahNumber=index+1;

        const saved=isSaved(number,ayahNumber);

        html+=`
        <div
            id="ayah-${number}-${ayahNumber}"
            class="ayah ${saved ? "saved-ayah" : ""}"
        >

            ${saved ? '<span class="saved-marker">🔖</span>' : ''}

            ${escapeHTML(verse)}

            <div class="save-row">

                <button
                    class="save-button ${saved ? "saved" : ""}"
                    onclick="savePosition(${number},${ayahNumber})"
                >
                    ${saved ? "✓ موضع القراءة محفوظ" : "🔖 حفظ موضع القراءة هنا"}
                </button>

            </div>

        </div>
        `;

    });

    html+=`
        </div>
    </section>

    <div class="navigation">

        <button
            onclick="previousSurah()"
            ${number===1 ? "disabled":""}>
            ← السورة السابقة
        </button>

        <button
            onclick="nextSurah()"
            ${number===114 ? "disabled":""}>
            السورة التالية →
        </button>

    </div>

    <div class="current">
        السورة ${number} من 114 — سورة ${surah.name}
    </div>
    `;

    content.className="";
    content.innerHTML=html;

    if(ayah>1){

        setTimeout(()=>{

            const target=document.getElementById(
                `ayah-${number}-${ayah}`
            );

            if(target){

                target.scrollIntoView({
                    behavior:"smooth",
                    block:"center"
                });

            }

        },100);

    }
}


function savePosition(surah,ayah){

    const data={
        surah:surah,
        ayah:ayah,
        name:surahNames[surah-1],
        savedAt:new Date().toISOString()
    };

    localStorage.setItem(
        "hadri_quran_bookmark",
        JSON.stringify(data)
    );

    showSavedPosition();

    showSurah(surah,ayah);

    setTimeout(()=>{

        const target=document.getElementById(
            `ayah-${surah}-${ayah}`
        );

        if(target){

            target.scrollIntoView({
                behavior:"smooth",
                block:"center"
            });

        }

    },150);
}


function isSaved(surah,ayah){

    const saved=localStorage.getItem(
        "hadri_quran_bookmark"
    );

    if(!saved) return false;

    try{

        const data=JSON.parse(saved);

        return data.surah===surah &&
               data.ayah===ayah;

    }catch(e){

        return false;

    }
}


function showSavedPosition(){

    const saved=localStorage.getItem(
        "hadri_quran_bookmark"
    );

    if(!saved){

        resumeBox.style.display="none";
        return;
    }

    try{

        const data=JSON.parse(saved);

        resumeText.innerHTML=
            `توقفت عند <strong>سورة ${data.name}</strong>،
             الآية <strong>${data.ayah}</strong>.`;

        resumeBox.style.display="block";

    }catch(e){

        resumeBox.style.display="none";

    }
}


function resumeReading(){

    const saved=localStorage.getItem(
        "hadri_quran_bookmark"
    );

    if(!saved) return;

    try{

        const data=JSON.parse(saved);

        showSurah(data.surah,data.ayah);

    }catch(e){

        clearBookmark();

    }
}


function clearBookmark(){

    localStorage.removeItem(
        "hadri_quran_bookmark"
    );

    resumeBox.style.display="none";

    showSurah(currentSurah,currentAyah);
}


function previousSurah(){

    if(currentSurah>1){

        showSurah(currentSurah-1,1);

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
}


function nextSurah(){

    if(currentSurah<114){

        showSurah(currentSurah+1,1);

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
}


function buildSurahList(){

    surahList.innerHTML="";

    surahs.forEach(surah=>{

        const item=document.createElement("div");

        item.className="surah-item";

        item.textContent=
            `سورة ${surah.name}`;

        item.onclick=()=>{

            showSurah(surah.number,1);

            surahList.style.display="none";

            searchInput.value="";

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        };

        surahList.appendChild(item);

    });
}


function searchSurah(){

    const value=searchInput.value.trim();

    if(!value){

        surahList.style.display=
            surahList.style.display==="block"
            ? "none"
            : "block";

        return;
    }

    const number=parseInt(value,10);

    let found=null;

    if(!isNaN(number) &&
       number>=1 &&
       number<=114){

        found=surahs[number-1];

    }else{

        found=surahs.find(surah=>
            surah.name.includes(value)
        );

    }

    if(found){

        showSurah(found.number,1);

        surahList.style.display="none";

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }else{

        alert("لم يتم العثور على السورة المطلوبة.");

    }
}


searchInput.addEventListener("focus",()=>{

    if(!searchInput.value.trim()){

        surahList.style.display="block";

    }

});


function escapeHTML(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
