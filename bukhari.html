<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>صحيح البخاري | حضري للكتب الإسلامية</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f5f7f6;
    color:#222;
    font-family:Tahoma,Arial,sans-serif;
}

header{
    background:#0f5132;
    color:#fff;
    padding:22px 15px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:27px;
}

header p{
    margin:8px 0 0;
    opacity:.9;
}

.top{
    width:94%;
    max-width:1000px;
    margin:18px auto;
}

.back{
    display:inline-block;
    background:#fff;
    color:#0f5132;
    text-decoration:none;
    padding:10px 18px;
    border-radius:8px;
    border:1px solid #ddd;
    font-weight:bold;
}

.info{
    text-align:center;
    margin:20px 0;
}

.info h2{
    color:#0f5132;
    margin:0 0 8px;
}

.info p{
    color:#666;
    margin:0;
}

#loading{
    text-align:center;
    padding:30px;
    color:#666;
}

#error{
    display:none;
    text-align:center;
    background:#fff;
    padding:25px;
    margin:20px auto;
    max-width:800px;
    border-radius:12px;
    color:#a00;
}

#hadiths{
    width:94%;
    max-width:1000px;
    margin:auto;
}

.hadith{
    background:#fff;
    margin:18px 0;
    padding:22px;
    border-radius:12px;
    border:1px solid #e3e3e3;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.hadith-number{
    color:#0f5132;
    font-size:18px;
    font-weight:bold;
    margin-bottom:15px;
}

.hadith-text{
    font-size:19px;
    line-height:2.2;
    text-align:right;
}

.source{
    margin-top:15px;
    color:#777;
    font-size:14px;
}

.pagination{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin:30px 0;
    flex-wrap:wrap;
}

.pagination button{
    border:0;
    background:#0f5132;
    color:#fff;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-family:inherit;
}

.pagination button:disabled{
    background:#bbb;
    cursor:not-allowed;
}

#pageInfo{
    font-weight:bold;
    color:#555;
}

footer{
    margin-top:40px;
    background:#0f5132;
    color:#fff;
    text-align:center;
    padding:20px;
}

@media(max-width:600px){
    header h1{
        font-size:23px;
    }

    .hadith{
        padding:16px;
    }

    .hadith-text{
        font-size:17px;
        line-height:2;
    }
}
</style>
</head>

<body>

<header>
    <h1>📜 صحيح البخاري</h1>
    <p>الجامع الصحيح للإمام محمد بن إسماعيل البخاري</p>
</header>

<div class="top">

    <!-- الرجوع إلى الصفحة الرئيسية -->
    <a href="index.html" class="back">
        ← الصفحة الرئيسية
    </a>

    <div class="info">
        <h2>صحيح البخاري</h2>
        <p id="count">جاري تحميل الأحاديث...</p>
    </div>

</div>

<div id="loading">
    جاري تحميل صحيح البخاري...
</div>

<div id="error">
    تعذر تحميل ملف الأحاديث.
    <br>
    تأكد من وجود الملف:
    <strong>bukhari.json</strong>
</div>

<div id="hadiths"></div>

<div class="pagination">
    <button id="prev">السابق</button>
    <span id="pageInfo">صفحة 1</span>
    <button id="next">التالي</button>
</div>

<footer>
    © 2026 حضري للكتب الإسلامية
</footer>

<script>

let allHadiths = [];
let currentPage = 1;

const perPage = 20;

const hadithContainer =
    document.getElementById("hadiths");

const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("error");

const countBox =
    document.getElementById("count");

const pageInfo =
    document.getElementById("pageInfo");

const prevButton =
    document.getElementById("prev");

const nextButton =
    document.getElementById("next");


async function loadHadith(){

    try{

        const response =
            await fetch("bukhari.json");

        if(!response.ok){
            throw new Error("JSON not found");
        }

        const data =
            await response.json();

        /*
         * دعم أكثر من شكل شائع لملف JSON
         */

        if(Array.isArray(data)){
            allHadiths = data;
        }

        else if(Array.isArray(data.hadiths)){
            allHadiths = data.hadiths;
        }

        else if(Array.isArray(data.data)){
            allHadiths = data.data;
        }

        else if(Array.isArray(data.books)){
            allHadiths = data.books;
        }

        else{
            throw new Error("Unknown JSON format");
        }

        loading.style.display = "none";

        countBox.textContent =
            "إجمالي الأحاديث: " +
            allHadiths.length;

        showPage();

    }

    catch(error){

        console.error(error);

        loading.style.display = "none";

        errorBox.style.display = "block";

        countBox.textContent =
            "تعذر تحميل الأحاديث";

    }

}


function getText(hadith){

    if(typeof hadith === "string"){
        return hadith;
    }

    return (
        hadith.text ||
        hadith.hadith ||
        hadith.arabic ||
        hadith.content ||
        hadith.body ||
        ""
    );

}


function getNumber(hadith,index){

    if(typeof hadith === "object"){

        return (
            hadith.number ||
            hadith.id ||
            hadith.hadithNumber ||
            index + 1
        );

    }

    return index + 1;

}


function showPage(){

    hadithContainer.innerHTML = "";

    const start =
        (currentPage - 1) * perPage;

    const end =
        Math.min(
            start + perPage,
            allHadiths.length
        );

    for(let i=start;i<end;i++){

        const hadith =
            allHadiths[i];

        const text =
            getText(hadith);

        const number =
            getNumber(hadith,i);

        const article =
            document.createElement("article");

        article.className = "hadith";

        article.innerHTML = `
            <div class="hadith-number">
                ${number} — حديث
            </div>

            <div class="hadith-text">
                ${escapeHTML(text)}
            </div>

            <div class="source">
                صحيح البخاري
            </div>
        `;

        hadithContainer.appendChild(article);

    }

    const totalPages =
        Math.max(
            1,
            Math.ceil(allHadiths.length / perPage)
        );

    pageInfo.textContent =
        "صفحة " +
        currentPage +
        " من " +
        totalPages;

    prevButton.disabled =
        currentPage === 1;

    nextButton.disabled =
        currentPage >= totalPages;

}


function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent =
        String(text);

    return div.innerHTML;

}


prevButton.addEventListener(
    "click",
    function(){

        if(currentPage > 1){

            currentPage--;

            showPage();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        }

    }
);


nextButton.addEventListener(
    "click",
    function(){

        const totalPages =
            Math.ceil(
                allHadiths.length / perPage
            );

        if(currentPage < totalPages){

            currentPage++;

            showPage();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        }

    }
);


loadHadith();

</script>

</body>
</html>
