<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>العقيدة والتوحيد | حضري للكتب الإسلامية</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f5f7f6;
    color:#222;
    font-family:Tahoma,Arial,sans-serif;
}

header{
    background:#0f5132;
    color:#fff;
    padding:22px 15px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:27px;
}

header p{
    margin:8px 0 0;
    opacity:.9;
}

.top{
    width:94%;
    max-width:1000px;
    margin:18px auto;
}

.back{
    display:inline-block;
    background:#fff;
    color:#0f5132;
    text-decoration:none;
    padding:10px 18px;
    border-radius:8px;
    border:1px solid #ddd;
    font-weight:bold;
}

.info{
    text-align:center;
    margin:20px 0;
}

.info h2{
    color:#0f5132;
    margin:0 0 8px;
}

.info p{
    color:#666;
    margin:0;
}

.books{
    width:94%;
    max-width:1000px;
    margin:25px auto;
}

.book{
    background:#fff;
    margin:18px 0;
    padding:25px;
    border-radius:12px;
    border:1px solid #e3e3e3;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    text-align:center;
}

.book-icon{
    font-size:45px;
    margin-bottom:12px;
}

.book h3{
    color:#0f5132;
    font-size:22px;
    margin:10px 0;
}

.book p{
    color:#666;
    font-size:16px;
    margin:8px 0 20px;
}

.read-button{
    display:inline-block;
    background:#0f5132;
    color:#fff;
    text-decoration:none;
    padding:12px 25px;
    border-radius:8px;
    font-weight:bold;
}

.read-button:hover{
    opacity:.9;
}

footer{
    margin-top:40px;
    background:#0f5132;
    color:#fff;
    text-align:center;
    padding:20px;
}

@media(max-width:600px){

    header h1{
        font-size:23px;
    }

    .book{
        padding:20px 15px;
    }

    .book h3{
        font-size:20px;
    }

}
</style>
</head>

<body>

<header>
    <h1>☪️ العقيدة والتوحيد</h1>
    <p>مكتبة حضري للكتب الإسلامية</p>
</header>

<div class="top">

    <a href="index.html" class="back">
        ← الصفحة الرئيسية
    </a>

    <div class="info">
        <h2>العقيدة والتوحيد</h2>
        <p>كتب العقيدة والتوحيد</p>
    </div>

</div>

<div class="books">

    <div class="book">

        <div class="book-icon">📖</div>

        <h3>كتاب التوحيد</h3>

        <p>
            كتاب التوحيد — محمد بن عبد الوهاب
        </p>

        <a
            href="كتاب_التوحيد.pdf"
            target="_blank"
            class="read-button">
            📖 قراءة الكتاب
        </a>

    </div>

</div>

<footer>
    © 2026 حضري للكتب الإسلامية
</footer>

</body>
</html>
